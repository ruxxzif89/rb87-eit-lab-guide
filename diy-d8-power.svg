<text x="522.00" y="622.00" font-size="11.5" text-anchor="start" fill="#1b1f24" font-weight="700">→ both attenuators, Vss (module pin P4)</text>
<rect x="20.00" y="660.00" width="960.00" height="270.00" rx="0" fill="#fffbe8" stroke="#b58900" stroke-width="1.4"/>
<text x="34.00" y="684.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Numbers</text>
<text x="34.00" y="710.00" font-size="11.5" text-anchor="start" fill="#1b1f24">LM317: V = 1.25 (1 + 330/240) + 50 µA × 330 = 2.99 V (attenuator limit 2.7 to 3.3 V). The programming current 5.2 mA is the load that keeps it regulating.</text>
<text x="34.00" y="736.00" font-size="11.5" text-anchor="start" fill="#1b1f24">LM337: V = −[1.25 (1 + 180/120) + 65 µA × 180] = -3.14 V (limit −2.7 to −3.3 V). Programming current 10.4 mA, which is its 10 mA minimum load.</text>
<text x="34.00" y="762.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Why the 3 V rails come from ±12 V and not from ±5 V: the LM317 / LM337 need about 2 V of head-room, and 5 V − 3 V is only 2 V.</text>
<text x="34.00" y="788.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Loads: each switch 22 mA typ, 60 mA max on both of its rails; each attenuator 3 mA (Vdd) and 0.1 mA (Vss) max.</text>
<text x="34.00" y="814.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Dissipation: 7805 and 7905 0.31 W typ, 0.84 W max (clip-on heatsink); LM317 0.10 W; LM337 0.09 W.</text>
<text x="34.00" y="840.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Supply draw from the ±12 V rails: at most 131 mA on the + side and 131 mA on the − side. Put 100 nF at every regulator output close to the load.</text>
<text x="34.00" y="866.00" font-size="11.5" text-anchor="start" fill="#1b1f24" font-weight="700">Power-on order: bias box first, then the +24 V of the amplifiers, then the synthesizer. Power-off in the reverse order.</text>
</svg>
