<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">D10 beam dump drawing</title><desc id="d">Section and views of the home-made beam dump block and the razor-blade alternative.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1"/></pattern><pattern id="hatchf" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#888" stroke-width="0.8"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#999"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b1f24"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="650" fill="#ffffff"/>
<text x="20.00" y="28.00" font-size="17" text-anchor="start" fill="#1b1f24" font-weight="700">D10  Beam dump (12 in the BOM): black block, deep bore, tilted entry</text>
<text x="20.00" y="48.00" font-size="12" text-anchor="start" fill="#6b7280">Aluminium block 30 × 30 × 45, black anodised or painted matte black (Aeroglaze-type paint, or a flat black spray). Drawing at 6 px per mm.</text>
<text x="40.00" y="104.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Section A–A through the bore</text>
<rect x="200.00" y="150.00" width="270.00" height="180.00" rx="0" fill="url(#hatch)" stroke="#1b1f24" stroke-width="1.4"/>
<polygon points="200.00,210.00 416.00,210.00 434.00,240.00 416.00,270.00 200.00,270.00" fill="#ffffff" stroke="#1b1f24" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="416.00" y1="210.00" x2="416.00" y2="270.00" stroke="#1b1f24" stroke-width="0.8" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="170.00" y1="240.00" x2="484.00" y2="240.00" stroke="#b5651d" stroke-width="1.0" stroke-dasharray="14 3 3 3" stroke-linecap="round"/>
<line x1="28.00" y1="209.67" x2="370.14" y2="270.00" stroke="#c0392b" stroke-width="2.0" stroke-linecap="round"/>
<text x="24.00" y="199.67" font-size="11.5" text-anchor="start" fill="#c0392b" font-weight="700">beam, 10° off the bore axis</text>
<path d="M 130.00 240.00 A 70 70 0 0 1 131.06 227.84" fill="none" stroke="#1b1f24" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="100.00" y="258.00" font-size="11.5" text-anchor="start" fill="#1b1f24">10°</text>
<line x1="200.00" y1="330.00" x2="200.00" y2="366.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="470.00" y1="330.00" x2="470.00" y2="366.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="200.00" y1="360.00" x2="470.00" y2="360.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="335.00" y="356.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">45</text>
<line x1="200.00" y1="150.00" x2="200.00" y2="120.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="416.00" y1="150.00" x2="416.00" y2="120.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="200.00" y1="126.00" x2="416.00" y2="126.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="308.00" y="122.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">bore depth 36</text>
<line x1="416.00" y1="210.00" x2="506.00" y2="210.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="416.00" y1="270.00" x2="506.00" y2="270.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="500.00" y1="210.00" x2="500.00" y2="270.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="505.00" y="244.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Ø10</text>
<line x1="470.00" y1="150.00" x2="546.00" y2="150.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="470.00" y1="330.00" x2="546.00" y2="330.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="540.00" y1="150.00" x2="540.00" y2="330.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="545.00" y="244.00" font-size="11.5" text-anchor="start" fill="#1b1f24">30</text>
<line x1="434.00" y1="240.00" x2="434.00" y2="106.00" stroke="#6b7280" stroke-width="1.0" stroke-linecap="round"/>
<circle cx="434.00" cy="240.00" r="2.2" fill="#6b7280"/>
<text x="438.00" y="110.00" font-size="11.5" text-anchor="start" fill="#1b1f24">118° drill point</text>
<text x="690.00" y="104.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Alternative: razor-blade stack</text>
<rect x="690.00" y="150.00" width="220.00" height="100.00" rx="3" fill="#e4e8ee" stroke="#1b1f24" stroke-width="1.4"/>
<polygon points="710.00,158.00 732.00,158.00 738.00,242.00 716.00,242.00" fill="#c9cfd6" stroke="#1b1f24" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="740.00,158.00 762.00,158.00 768.00,242.00 746.00,242.00" fill="#c9cfd6" stroke="#1b1f24" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="770.00,158.00 792.00,158.00 798.00,242.00 776.00,242.00" fill="#c9cfd6" stroke="#1b1f24" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="800.00,158.00 822.00,158.00 828.00,242.00 806.00,242.00" fill="#c9cfd6" stroke="#1b1f24" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="830.00,158.00 852.00,158.00 858.00,242.00 836.00,242.00" fill="#c9cfd6" stroke="#1b1f24" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="860.00,158.00 882.00,158.00 888.00,242.00 866.00,242.00" fill="#c9cfd6" stroke="#1b1f24" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="650.00" y1="200.00" x2="710.00" y2="200.00" stroke="#c0392b" stroke-width="2.0" stroke-linecap="round"/>
<text x="650.00" y="190.00" font-size="11.5" text-anchor="start" fill="#c0392b" font-weight="700">beam</text>
<text x="690.00" y="274.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Six blades, 2.5 mm apart, in a slot, edges</text>
<text x="690.00" y="290.00" font-size="11.5" text-anchor="start" fill="#1b1f24">towards the beam: the light bounces from</text>
<text x="690.00" y="306.00" font-size="11.5" text-anchor="start" fill="#1b1f24">blade to blade and dies (about 10 mW).</text>
<rect x="20.00" y="400.00" width="960.00" height="180.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="34.00" y="424.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Why and how</text>
<text x="34.00" y="448.00" font-size="11.5" text-anchor="start" fill="#1b1f24">The BOM has 12 dumps: 4 AOM zeroth orders, 1 Glan reject, 1 SAS pump, 6 PBS leakage ports. The strongest beam is the AOM zeroth order of the control</text>
<text x="34.00" y="464.00" font-size="11.5" text-anchor="start" fill="#1b1f24">arm: about 10 mW with the laser at its full 15 mW.</text>
<text x="34.00" y="486.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Tilt the block 10° so the reflection off the front face does not return along the beam. Mount it on a post with a 30 mm cage clamp or two M4 screws</text>
<text x="34.00" y="502.00" font-size="11.5" text-anchor="start" fill="#1b1f24">through the block.</text>
<text x="34.00" y="524.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Do not polish the bore: a rough, matte black wall scatters the light, the beam meets the wall about 28 mm from the mouth (5 mm / tan 10°) at a grazing</text>
<text x="34.00" y="540.00" font-size="11.5" text-anchor="start" fill="#1b1f24">angle and loses power at every bounce, and the drill-point end (118°) stops what is left.</text>
<text x="34.00" y="562.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Check each dump with an IR viewer card and the power meter: nothing visible should come back, and the dump should be only lukewarm.</text>
<rect x="20.00" y="604.00" width="960.00" height="34.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="30.00" y="619.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">D10  Beam dump</text>
<text x="30.00" y="633.00" font-size="11" text-anchor="start" fill="#6b7280">Block 30 × 30 × 45, Ø10 bore 36 deep with a drill-point end, matte black, 10° tilt. Alternative: six razor blades in a slot.</text>
</svg>
