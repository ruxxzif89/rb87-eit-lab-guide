<text x="405.00" y="209.00" font-size="10.5" text-anchor="middle" fill="#1b1f24">C16 C8 C4 C2 C1 C.5</text>
<circle cx="96.00" cy="242.00" r="13.00" fill="#fff" stroke="#1b1f24" stroke-width="1.8"/>
