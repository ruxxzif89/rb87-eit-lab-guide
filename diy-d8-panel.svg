<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">D8 RF box panels</title><desc id="d">Front and rear panel drawing of the RF bias and control box with the hole positions.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1"/></pattern><pattern id="hatchf" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#888" stroke-width="0.8"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#999"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b1f24"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="710" fill="#ffffff"/>
<text x="20.00" y="28.00" font-size="17" text-anchor="start" fill="#1b1f24" font-weight="700">D8  RF bias and control box: front and rear panel (aluminium 160 × 120 × 55 mm, panels drawn at 3 px per mm)</text>
<text x="20.00" y="48.00" font-size="12" text-anchor="start" fill="#6b7280">Hole sizes: DIP switches rectangular cut-out 30 × 12 mm; BNC Ø9.5; LED Ø5; binding post Ø9.5; 10-pin header cut-out 22 × 7 mm. Drill with the panel flat.</text>
<text x="300.00" y="98.00" font-size="13" text-anchor="middle" fill="#1b1f24" font-weight="700">Front panel (160 × 55)</text>
