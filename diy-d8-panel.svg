<text x="504.00" y="269.00" font-size="10.5" text-anchor="middle" fill="#1b1f24" font-weight="700">GATE B</text>
<circle cx="246.00" cy="242.00" r="5.00" fill="#2e7d32" stroke="#1b1f24" stroke-width="1"/>
