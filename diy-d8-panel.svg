<text x="41.00" y="196.50" font-size="11.5" text-anchor="end" fill="#1b1f24">55</text>
<text x="300.00" y="318.00" font-size="13" text-anchor="middle" fill="#1b1f24" font-weight="700">Rear panel (160 × 55)</text>
<rect x="60.00" y="330.00" width="480.00" height="165.00" rx="3" fill="#e4e8ee" stroke="#1b1f24" stroke-width="1.8"/>
<circle cx="105.00" cy="378.00" r="14.00" fill="#fff" stroke="#c0392b" stroke-width="2.2"/>
<text x="105.00" y="420.00" font-size="11" text-anchor="middle" fill="#1b1f24" font-weight="700">+12</text>
<circle cx="147.00" cy="378.00" r="14.00" fill="#fff" stroke="#1b1f24" stroke-width="2.2"/>
<text x="147.00" y="420.00" font-size="11" text-anchor="middle" fill="#1b1f24" font-weight="700">GND</text>
<circle cx="189.00" cy="378.00" r="14.00" fill="#fff" stroke="#1f5fa8" stroke-width="2.2"/>
<text x="189.00" y="420.00" font-size="11" text-anchor="middle" fill="#1b1f24" font-weight="700">−12</text>
<rect x="246.00" y="360.00" width="60.00" height="36.00" rx="2" fill="#fff7e0" stroke="#d9770a" stroke-width="1.4"/>
<text x="276.00" y="384.00" font-size="11" text-anchor="middle" fill="#1b1f24" font-weight="700">SW A</text>
<text x="276.00" y="414.00" font-size="10" text-anchor="middle" fill="#6b7280">+5 −5 GND</text>
<rect x="321.00" y="360.00" width="60.00" height="36.00" rx="2" fill="#fff7e0" stroke="#d9770a" stroke-width="1.4"/>
<text x="351.00" y="384.00" font-size="11" text-anchor="middle" fill="#1b1f24" font-weight="700">SW B</text>
<text x="351.00" y="414.00" font-size="10" text-anchor="middle" fill="#6b7280">+5 −5 GND</text>
<rect x="246.00" y="438.00" width="60.00" height="21.00" rx="2" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="1.4"/>
<text x="276.00" y="480.00" font-size="10" text-anchor="middle" fill="#1b1f24" font-weight="700">ATT A J1</text>
<rect x="321.00" y="438.00" width="60.00" height="21.00" rx="2" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="1.4"/>
<text x="351.00" y="480.00" font-size="10" text-anchor="middle" fill="#1b1f24" font-weight="700">ATT B J1</text>
<rect x="620.00" y="90.00" width="360.00" height="206.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="634.00" y="114.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Inside the box</text>
<text x="634.00" y="138.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Boards: one perfboard 100 × 70 mm for the rails (the four regulators</text>
<text x="634.00" y="157.00" font-size="11.5" text-anchor="start" fill="#1b1f24">   on a small aluminium angle as heatsink), one for the DIP banks.</text>
<text x="634.00" y="176.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Wires: 0.35 mm² for DC, twisted pairs for ±5 V and ±3 V.</text>
<text x="634.00" y="195.00" font-size="11.5" text-anchor="start" fill="#1b1f24">LEDs with 2.2 kΩ resistors show the four rails.</text>
<text x="634.00" y="214.00" font-size="11.5" text-anchor="start" fill="#1b1f24">The 24 V for the amplifiers does not pass through the box:</text>
<text x="634.00" y="233.00" font-size="11.5" text-anchor="start" fill="#1b1f24">   it goes directly from the supply to each amplifier (0.9 A each).</text>
<text x="634.00" y="252.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Earth: only if a mains supply is inside; with a low-voltage supply</text>
<text x="634.00" y="271.00" font-size="11.5" text-anchor="start" fill="#1b1f24">   leave the box floating, ground the SMA shields.</text>
<rect x="20.00" y="520.00" width="960.00" height="140.00" rx="0" fill="#fffbe8" stroke="#b58900" stroke-width="1.4"/>
<text x="34.00" y="544.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Commissioning of the box (before any RF part is connected)</text>
<text x="34.00" y="568.00" font-size="11.5" text-anchor="start" fill="#1b1f24">1  Rails: with nothing connected, measure +5.00 V (4.9–5.2), −5.00 V (−4.9 to −5.2), +2.99 V and −3.14 V (limits 2.7–3.3 V, −2.7 to −3.3 V) at the rear terminals.</text>
<text x="34.00" y="592.00" font-size="11.5" text-anchor="start" fill="#1b1f24">2  Gate input: 10 kHz square, 0–3.3 V, to GATE A: the signal at the switch pin 4 is the same square with 100 Ω in series (check with the scope).</text>
<text x="34.00" y="616.00" font-size="11.5" text-anchor="start" fill="#1b1f24">3  DIP: with a multimeter on J1-5 (C16): ON = about +3.0 V, OFF = 0 V; the same for the other five bits.</text>
<text x="34.00" y="640.00" font-size="11.5" text-anchor="start" fill="#1b1f24">4  Connect one switch and one attenuator, synthesizer 0 dBm into a 50 Ω scope input: the switch must gate it, the attenuator must give 0.5 dB steps.</text>
<text x="34.00" y="664.00" font-size="11.5" text-anchor="start" fill="#1b1f24">5  Only then connect the amplifier (+24 V) with the 50 Ω load, and last the AOM.</text>
<rect x="20.00" y="664.00" width="960.00" height="34.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="30.00" y="679.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">D8  Box panels</text>
<text x="30.00" y="693.00" font-size="11" text-anchor="start" fill="#6b7280">Aluminium box 160 × 120 × 55: front panel with the DIP banks, gate BNCs and rail LEDs; rear panel with the ±12 V posts and the DC connectors.</text>
</svg>
