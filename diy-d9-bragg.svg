<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 910" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">D9 Bragg geometry and double pass</title><desc id="d">Bragg angle and first order deflection of the AOM at 795 nm and the cat eye double-pass arrangement with its numbers.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1"/></pattern><pattern id="hatchf" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#888" stroke-width="0.8"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#999"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b1f24"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="910" fill="#ffffff"/>
<text x="20.00" y="28.00" font-size="17" text-anchor="start" fill="#1b1f24" font-weight="700">D9  Bragg angle and the double pass (angles exaggerated, distances to scale along the beam)</text>
<text x="20.00" y="48.00" font-size="12" text-anchor="start" fill="#6b7280">Light of 795 nm in a TeO₂ AOM at 80 MHz: sound speed 4.2 mm/µs (G&amp;H data for the 3080 family).</text>
<text x="40.00" y="92.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Single pass (top view)</text>
<rect x="240.00" y="150.00" width="120.00" height="80.00" rx="2" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="300.00" y="144.00" font-size="11.5" text-anchor="middle" fill="#1f5fa8" font-weight="700">AOM crystal</text>
<line x1="246.79" y1="154.00" x2="257.21" y2="226.00" stroke="#9bb6d3" stroke-width="1.0" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="262.79" y1="154.00" x2="273.21" y2="226.00" stroke="#9bb6d3" stroke-width="1.0" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="278.79" y1="154.00" x2="289.21" y2="226.00" stroke="#9bb6d3" stroke-width="1.0" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="294.79" y1="154.00" x2="305.21" y2="226.00" stroke="#9bb6d3" stroke-width="1.0" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="310.79" y1="154.00" x2="321.21" y2="226.00" stroke="#9bb6d3" stroke-width="1.0" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="326.79" y1="154.00" x2="337.21" y2="226.00" stroke="#9bb6d3" stroke-width="1.0" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="342.79" y1="154.00" x2="353.21" y2="226.00" stroke="#9bb6d3" stroke-width="1.0" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="300.00" y="246.00" font-size="11" text-anchor="middle" fill="#5b7ba0">sound wave fronts</text>
<line x1="80.00" y1="204.00" x2="240.00" y2="204.00" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="240.00" y1="204.00" x2="360.00" y2="204.00" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="360.00" y1="204.00" x2="560.00" y2="204.00" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="360.00" y1="204.00" x2="560.00" y2="114.00" stroke="#d9770a" stroke-width="2.2" stroke-linecap="round"/>
<text x="566.00" y="208.00" font-size="11.5" text-anchor="start" fill="#c0392b" font-weight="700">0th order</text>
<text x="566.00" y="118.00" font-size="11.5" text-anchor="start" fill="#d9770a" font-weight="700">1st order, deflected by 2θ</text>
<text x="90.00" y="192.00" font-size="11.5" text-anchor="start" fill="#c0392b" font-weight="700">beam in</text>
<path d="M 400.0 204.0 A 70 70 0 0 0 460.6 169.0" fill="none" stroke="#1b1f24" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="490.00" y="168.00" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="700">2θ_B = 15.14 mrad = 0.87°</text>
<text x="80.00" y="264.00" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="700">the beam hits the sound fronts at θ_B = λf / 2v = 7.57 mrad (0.43°)</text>
<text x="80.00" y="282.00" font-size="11.5" text-anchor="start" fill="#1b1f24">turn the AOM until the 1st order is brightest: that is the Bragg condition</text>
<text x="40.00" y="372.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Cat-eye double pass (the first-order tilt is exaggerated 20 times)</text>
<rect x="80.00" y="440.00" width="40.00" height="56.00" rx="2" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="100.00" y="514.00" font-size="11.5" text-anchor="middle" fill="#1f5fa8" font-weight="700">AOM</text>
<line x1="340.00" y1="424.00" x2="340.00" y2="512.00" stroke="#1b1f24" stroke-width="3.0" stroke-linecap="round"/>
<text x="340.00" y="530.00" font-size="11.5" text-anchor="middle" fill="#1b1f24" font-weight="700">lens, focal length f</text>
<line x1="760.00" y1="410.00" x2="760.00" y2="512.00" stroke="#1b1f24" stroke-width="4.0" stroke-linecap="round"/>
<text x="760.00" y="530.00" font-size="11.5" text-anchor="middle" fill="#1b1f24" font-weight="700">retro mirror</text>
<line x1="40.00" y1="468.00" x2="100.00" y2="468.00" stroke="#c0392b" stroke-width="2.0" stroke-linecap="round"/>
<line x1="100.00" y1="468.00" x2="760.00" y2="468.00" stroke="#c0392b" stroke-width="2.0" stroke-linecap="round"/>
<line x1="100.00" y1="468.00" x2="760.00" y2="432.00" stroke="#d9770a" stroke-width="2.0" stroke-linecap="round"/>
<circle cx="760.00" cy="468.00" r="4" fill="#c0392b"/>
<circle cx="760.00" cy="432.00" r="4" fill="#d9770a"/>
<text x="772.00" y="472.00" font-size="11.5" text-anchor="start" fill="#c0392b" font-weight="700">0th order focus</text>
<text x="772.00" y="436.00" font-size="11.5" text-anchor="start" fill="#d9770a" font-weight="700">1st order focus</text>
<line x1="730.00" y1="432.00" x2="730.00" y2="468.00" stroke="#1b1f24" stroke-width="1.0" stroke-linecap="round"/>
<text x="722.00" y="456.00" font-size="11.5" text-anchor="end" fill="#1b1f24" font-weight="700">S = f × 2θ_B</text>
<line x1="100.00" y1="424.00" x2="100.00" y2="400.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="340.00" y1="424.00" x2="340.00" y2="400.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="100.00" y1="406.00" x2="340.00" y2="406.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="220.00" y="402.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">f</text>
<line x1="340.00" y1="424.00" x2="340.00" y2="400.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="760.00" y1="424.00" x2="760.00" y2="400.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="340.00" y1="406.00" x2="760.00" y2="406.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="550.00" y="402.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">f</text>
<text x="560.00" y="558.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">after the mirror both beams go back along their own paths, through the lens and the AOM again</text>
<rect x="20.00" y="580.00" width="960.00" height="270.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="34.00" y="604.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Design numbers for the arm</text>
<text x="34.00" y="630.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Separation of the 0th and 1st order foci at the mirror = f × 15.14 mrad:   f = 100 mm (the BOM lens, AC254-100-B) → 1.51 mm;   f = 150 mm → 2.27 mm;</text>
<text x="34.00" y="646.00" font-size="11.5" text-anchor="start" fill="#1b1f24">f = 200 mm → 3.03 mm.</text>
<text x="34.00" y="666.00" font-size="11.5" text-anchor="start" fill="#1b1f24">The focus of a 1.5 mm beam has a radius of only w₀ = λf/πw = 34 µm for f = 100 mm, so the two foci are 45 radii apart. A razor-blade edge 0.75 mm from</text>
<text x="34.00" y="682.00" font-size="11.5" text-anchor="start" fill="#1b1f24">each focus, on a small translation stage, stops the 0th order and passes the 1st. If that is too tight, use an f = 200 mm lens (3.0 mm).</text>
<text x="34.00" y="702.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Beam into the AOM: collimated, 1–1.5 mm. The aperture height is 2 mm for the 3080-125 (fits) and 1 mm for the 3080-122 (a 1.5 mm beam would be</text>
<text x="34.00" y="718.00" font-size="11.5" text-anchor="start" fill="#1b1f24">clipped: use ≤ 0.8 mm). Read the aperture on the data sheet of the unit you buy.</text>
<text x="34.00" y="738.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Rise time ≈ 159 ns per mm of beam diameter: 238 ns for 1.5 mm, fast enough for the µs pulses of the storage experiment.</text>
<text x="34.00" y="758.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Frequency: each pass adds the RF frequency, so the double pass shifts the light by 2 × 80 MHz = 160 MHz (and the two arms differ by 2 × 35 kHz = 70</text>
<text x="34.00" y="774.00" font-size="11.5" text-anchor="start" fill="#1b1f24">kHz).</text>
<text x="34.00" y="794.00" font-size="11.5" text-anchor="start" fill="#1b1f24">The lock offset: the SAS has no AOM, so the laser must be locked 160 MHz away from the line the cell sees (open item in the guide).</text>
<rect x="20.00" y="864.00" width="960.00" height="34.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="30.00" y="879.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">D9  Bragg geometry</text>
<text x="30.00" y="893.00" font-size="11" text-anchor="start" fill="#6b7280">θ_B = 7.57 mrad; deflection 2θ_B = 15.14 mrad; with the BOM lens f = 100 mm the two foci are 1.5 mm apart at the mirror.</text>
</svg>
