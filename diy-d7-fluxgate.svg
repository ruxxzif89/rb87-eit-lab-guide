<rect x="165.00" y="1154.00" width="660.00" height="12.00" rx="0" fill="#e9dfc5" stroke="#1b1f24" stroke-width="1.2"/>
<line x1="495.00" y1="1094.00" x2="495.00" y2="1172.00" stroke="#b5651d" stroke-width="1.0" stroke-dasharray="14 3 3 3" stroke-linecap="round"/>
<text x="501.00" y="1092.00" font-size="11.5" text-anchor="start" fill="#6b7280">z = 0</text>
