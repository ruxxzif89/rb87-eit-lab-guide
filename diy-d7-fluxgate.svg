<text x="880.00" y="606.00" font-size="11.5" text-anchor="start" fill="#1b1f24">14</text>
<text x="772.00" y="606.00" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">detection coil 22</text>
<text x="70.00" y="700.00" font-size="11.5" text-anchor="start" fill="#6b7280">The colours are for the drawing: wire the sensor as you like, but keep +5 V and 0 V as one twisted pair and OUT+ / OUT− as another.</text>
<text x="70.00" y="740.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Numbers and checks</text>
<text x="70.00" y="764.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Scale ±1 V per 50 µT = 20 mV per µT = 2 mV per mG; output at most ±2.5 V. OUT− sits at 2.5 V above 0 V, so read OUT+ − OUT− with a floating DMM, never</text>
<text x="70.00" y="781.00" font-size="11.5" text-anchor="start" fill="#1b1f24">OUT+ against ground.</text>
<text x="70.00" y="803.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Noise below 0.5 nT rms (3 nT peak to peak, 0.1 to 10 Hz) = 0.03 mG; zero drift below 2 nT per kelvin; accuracy ±2 % ± 0.3 µT at 20 °C, so the offset</text>
<text x="70.00" y="820.00" font-size="11.5" text-anchor="start" fill="#1b1f24">can be ± 3 mG: use differences.</text>
<text x="70.00" y="842.00" font-size="11.5" text-anchor="start" fill="#1b1f24">R_f drops 20 mV at 2 mA; the R_f–C3 corner is 34 Hz; the LM7805 dissipates 0.05 W (no heatsink); R_b keeps 5 mA on the regulator; the sensor gets 4.98</text>
<text x="70.00" y="859.00" font-size="11.5" text-anchor="start" fill="#1b1f24">V (limit 5 V ± 5 %).</text>
<text x="70.00" y="881.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Alternative: a 9 V battery and a low-dropout 5 V regulator in place of the +12 V: no mains ripple at all, about 70 hours per battery.</text>
<text x="70.00" y="903.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Check: scope across OUT+ and OUT−, coil and heater off: ripple at 50 and 100 Hz shows whether the supply is the limit.</text>
<text x="70.00" y="960.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Sensor holder: it takes the place of the cell stack inside the former (side section, scale 3 px per mm)</text>
<rect x="120.00" y="1046.00" width="750.00" height="168.00" rx="0" fill="#9aa5b1" stroke="#1b1f24" stroke-width="1.4"/>
