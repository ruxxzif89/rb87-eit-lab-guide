<text x="487.00" y="1124.00" font-size="11.5" text-anchor="end" fill="#d9770a" font-weight="700">FLC100 44.5 × 14 × 5.5</text>
<line x1="399.00" y1="1145.00" x2="126.00" y2="1145.00" stroke="#1b1f24" stroke-width="2.4" stroke-linecap="round"/>
<line x1="126.00" y1="1145.00" x2="90.00" y2="1145.00" stroke="#1b1f24" stroke-width="2.4" stroke-linecap="round"/>
<text x="36.00" y="1137.00" font-size="11.5" text-anchor="start" fill="#1b1f24" font-weight="700">cable, 4 wires</text>
<line x1="315.00" y1="1160.00" x2="325.00" y2="1244.00" stroke="#6b7280" stroke-width="1.0" stroke-linecap="round"/>
<circle cx="315.00" cy="1160.00" r="2.2" fill="#6b7280"/>
<text x="329.00" y="1248.00" font-size="11.5" text-anchor="start" fill="#1b1f24" font-weight="700">PEEK plate 220 × 28 × 4, pocket 45 × 14.4 × 3, M3 nylon screws</text>
<line x1="255.00" y1="1073.00" x2="255.00" y2="1016.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="735.00" y1="1073.00" x2="735.00" y2="1016.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="255.00" y1="1022.00" x2="735.00" y2="1022.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="495.00" y="1018.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">former 160</text>
<text x="70.00" y="1270.00" font-size="11.5" text-anchor="start" fill="#1b1f24">The cell stack is taken out and the plate slides in with the centre of the detection coil at z = 0, on the axis: the field is read where the atoms</text>
<text x="70.00" y="1287.00" font-size="11.5" text-anchor="start" fill="#1b1f24">will be.</text>
<text x="70.00" y="1309.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Only the axial component fits (the sensor is 44.5 mm long, the bore 34 mm). A transverse field B_t changes |B| by B_t² / 2B_z: 1 mG across 50 mG is</text>
<text x="70.00" y="1326.00" font-size="11.5" text-anchor="start" fill="#1b1f24">0.01 mG, so the axial reading is what counts.</text>
<text x="70.00" y="1348.00" font-size="11.5" text-anchor="start" fill="#1b1f24">To find the sensor offset turn the plate end for end (the coil centre stays at z = 0) and average the two readings, or use differences; the atoms give</text>
<text x="70.00" y="1365.00" font-size="11.5" text-anchor="start" fill="#1b1f24">the absolute zero.</text>
<text x="70.00" y="1387.00" font-size="11.5" text-anchor="start" fill="#1b1f24" font-weight="700">Non-magnetic fittings only inside the shield: nylon or brass screws, no nickel-plated connector shells (leave the connector outside the shield).</text>
