<circle cx="390.00" cy="502.00" r="2.2" fill="#6b7280"/>
<text x="316.00" y="628.00" font-size="11.5" text-anchor="end" fill="#1b1f24" font-weight="700">foam 3.0 thick</text>
<rect x="20.00" y="710.00" width="960.00" height="180.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="34.00" y="732.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Assembly order and rules</text>
<text x="34.00" y="758.00" font-size="11.5" text-anchor="start" fill="#1b1f24">1  NTC bead glued to the glass with thermally conductive epoxy, 5 mm from the end window; its leads run flat under the foil edge.</text>
<text x="34.00" y="778.00" font-size="11.5" text-anchor="start" fill="#1b1f24">2  Heater 80 × 25 wraps once round the barrel (circumference 78.5, so 1.5 mm overlap), tails towards the cable end. No glue on the windows.</text>
<text x="34.00" y="798.00" font-size="11.5" text-anchor="start" fill="#1b1f24">3  Foam sleeve (ID 25.6, OD 31.6, length 34) over the heater; heater tails and NTC pair run along the 1.2 mm clearance to the cable end.</text>
<text x="34.00" y="818.00" font-size="11.5" text-anchor="start" fill="#1b1f24">4  Two Delrin tubes Ø33.7 × Ø26.5 × 63, one on each side, push on the sleeve ends and centre the stack in the 160 mm former (their inner 4 mm act as end rings).</text>
<text x="48.00" y="838.00" font-size="11.5" text-anchor="start" fill="#1b1f24">A 2 × 2 mm groove along the outside of the cable-side tube carries the leads. The tubes do not touch the glass.</text>
<text x="34.00" y="858.00" font-size="11.5" text-anchor="start" fill="#1b1f24">5  Side stem on the cell? Cut a 10 × 14 slot in sleeve and former at the mid-plane (the winding wire bridges the slot). Ask for a stem ≤ 15 mm.</text>
<rect x="20.00" y="894.00" width="960.00" height="34.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="30.00" y="909.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">D2  Cell stack</text>
<text x="30.00" y="923.00" font-size="11" text-anchor="start" fill="#6b7280">Cell Ø25 × 28 · heater 80 × 25 × 0.2 · foam Ø31.6 × 34 · two tubes Ø33.7 × 63 · former bore Ø34 (1.2 mm radial clearance for the leads).</text>
</svg>
