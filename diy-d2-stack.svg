<rect x="20.00" y="700.00" width="960.00" height="194.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="34.00" y="722.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Assembly order and rules</text>
<text x="34.00" y="748.00" font-size="11.5" text-anchor="start" fill="#1b1f24">1  NTC bead glued to the glass with thermally conductive epoxy, 5 mm from the end window; its leads run flat under the foil edge.</text>
<text x="34.00" y="768.00" font-size="11.5" text-anchor="start" fill="#1b1f24">2  Heater film 68 × 25 wraps round the barrel (circumference 78.5), leaving a 10.5 mm strip free under the stem. No glue on the windows.</text>
<text x="34.00" y="788.00" font-size="11.5" text-anchor="start" fill="#1b1f24">3  Foam sleeve (ID 25.6, OD 31.6, length 34) over the heater; heater tails and NTC pair run along the 1.2 mm clearance to the cable end.</text>
<text x="34.00" y="808.00" font-size="11.5" text-anchor="start" fill="#1b1f24">4  Two Delrin tubes Ø33.7 × Ø26.5 × 63, one on each side, push on the sleeve ends and centre the stack in the 160 mm former (their inner 4 mm act as end rings).</text>
<text x="48.00" y="828.00" font-size="11.5" text-anchor="start" fill="#1b1f24">A 2 × 2 mm groove along the outside of the cable-side tube carries the leads. The tubes do not touch the glass.</text>
<text x="34.00" y="848.00" font-size="11.5" text-anchor="start" fill="#1b1f24">5  Stem up, at mid-length, ≤ 4.0 mm high: the wrapped cell must slide into the WOUND former, so the stem stays inside the Ø34 bore.</text>
<text x="48.00" y="868.00" font-size="11.5" text-anchor="start" fill="#1b1f24">It slides along the 0.6 mm deep channel at the top of the bore. Never cut through the former or the winding for a stem. Test-fit in the D1 test coupon first.</text>
<rect x="20.00" y="900.00" width="960.00" height="34.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="30.00" y="915.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">D2  Cell stack</text>
<text x="30.00" y="929.00" font-size="11" text-anchor="start" fill="#6b7280">Cell Ø25 × 28 with stem ≤ 4 · heater 68 × 25 × 0.2 · foam Ø31.6 × 34 · two tubes Ø33.7 × 63 · former bore Ø34.</text>
</svg>
