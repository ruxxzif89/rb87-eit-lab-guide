<text x="20.00" y="48.00" font-size="12" text-anchor="start" fill="#6b7280">Axial section, scale 10 px per mm, drawn cut at ±27 mm. Hatched parts are plastic (PEEK / Delrin). Cell dimensions are from the BOM: confirm them with the vendor drawing.</text>
