<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">D8 RF chain level plan</title><desc id="d">Block diagram of one AOM drive channel with the power level in dBm after every stage and the control and supply connections.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1"/></pattern><pattern id="hatchf" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#888" stroke-width="0.8"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#999"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b1f24"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="900" fill="#ffffff"/>
<text x="20.00" y="28.00" font-size="17" text-anchor="start" fill="#1b1f24" font-weight="700">D8  RF chain of one AOM arm: stages, levels, supplies and controls</text>
<text x="20.00" y="48.00" font-size="12" text-anchor="start" fill="#6b7280">Channel A (80.000 MHz). Channel B (79.965 MHz) is the same chain. Levels for typical amplifier gain 33 dB and the attenuator at 0 dB (the worst case).</text>
<rect x="20.00" y="120.00" width="120.00" height="80.00" rx="6" fill="#eef2f6" stroke="#1b1f24" stroke-width="1.8"/>
<text x="80.00" y="144.00" font-size="12.5" text-anchor="middle" fill="#1b1f24" font-weight="700">SynthHD</text>
<text x="80.00" y="164.00" font-size="11" text-anchor="middle" fill="#6b7280">CH A, 80.000 MHz</text>
<text x="80.00" y="180.00" font-size="11" text-anchor="middle" fill="#6b7280">BOM R01</text>
<rect x="180.00" y="120.00" width="120.00" height="80.00" rx="6" fill="#eef2f6" stroke="#1b1f24" stroke-width="1.8"/>
<text x="240.00" y="144.00" font-size="12.5" text-anchor="middle" fill="#1b1f24" font-weight="700">RF switch</text>
<text x="240.00" y="164.00" font-size="11" text-anchor="middle" fill="#6b7280">ZASWA-2-50DR+</text>
<text x="240.00" y="180.00" font-size="11" text-anchor="middle" fill="#6b7280">BOM R04</text>
<rect x="340.00" y="120.00" width="120.00" height="80.00" rx="6" fill="#eef2f6" stroke="#1b1f24" stroke-width="1.8"/>
<text x="400.00" y="144.00" font-size="12.5" text-anchor="middle" fill="#1b1f24" font-weight="700">step attenuator</text>
<text x="400.00" y="164.00" font-size="11" text-anchor="middle" fill="#6b7280">ZX76-31R5-PN-S+</text>
<text x="400.00" y="180.00" font-size="11" text-anchor="middle" fill="#6b7280">BOM R03</text>
<rect x="500.00" y="120.00" width="120.00" height="80.00" rx="6" fill="#eef2f6" stroke="#1b1f24" stroke-width="1.8"/>
<text x="560.00" y="144.00" font-size="12.5" text-anchor="middle" fill="#1b1f24" font-weight="700">amplifier</text>
<text x="560.00" y="164.00" font-size="11" text-anchor="middle" fill="#6b7280">ZHL-1-2W-S+, +24 V</text>
<text x="560.00" y="180.00" font-size="11" text-anchor="middle" fill="#6b7280">BOM R02</text>
<rect x="660.00" y="120.00" width="120.00" height="80.00" rx="6" fill="#eef2f6" stroke="#1b1f24" stroke-width="1.8"/>
<text x="720.00" y="144.00" font-size="12.5" text-anchor="middle" fill="#1b1f24" font-weight="700">coupler 20 dB</text>
<text x="720.00" y="164.00" font-size="11" text-anchor="middle" fill="#6b7280">ZFDC-20-4-S+</text>
<text x="720.00" y="180.00" font-size="11" text-anchor="middle" fill="#6b7280">BOM R06</text>
<rect x="820.00" y="120.00" width="120.00" height="80.00" rx="6" fill="#eef2f6" stroke="#1b1f24" stroke-width="1.8"/>
<text x="880.00" y="144.00" font-size="12.5" text-anchor="middle" fill="#1b1f24" font-weight="700">AOM</text>
<text x="880.00" y="164.00" font-size="11" text-anchor="middle" fill="#6b7280">80 MHz, 50 Ω</text>
<text x="880.00" y="180.00" font-size="11" text-anchor="middle" fill="#6b7280">BOM O17</text>
<line x1="140.0" y1="160.0" x2="180.0" y2="160.0" stroke="#1b1f24" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="300.0" y1="160.0" x2="340.0" y2="160.0" stroke="#1b1f24" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="460.0" y1="160.0" x2="500.0" y2="160.0" stroke="#1b1f24" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="620.0" y1="160.0" x2="660.0" y2="160.0" stroke="#1b1f24" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="780.0" y1="160.0" x2="820.0" y2="160.0" stroke="#1b1f24" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="80.00" y="222.00" font-size="12.5" text-anchor="middle" fill="#1b1f24" font-weight="700">+0.0 dBm</text>
<text x="80.00" y="238.00" font-size="11" text-anchor="middle" fill="#6b7280">synth out</text>
<text x="240.00" y="222.00" font-size="12.5" text-anchor="middle" fill="#1b1f24" font-weight="700">-1.3 dBm</text>
<text x="240.00" y="238.00" font-size="11" text-anchor="middle" fill="#6b7280">switch out</text>
<text x="400.00" y="222.00" font-size="12.5" text-anchor="middle" fill="#1b1f24" font-weight="700">-2.8 dBm</text>
<text x="400.00" y="238.00" font-size="11" text-anchor="middle" fill="#6b7280">attenuator out</text>
<text x="560.00" y="222.00" font-size="12.5" text-anchor="middle" fill="#c0392b" font-weight="700">+30.2 dBm</text>
<text x="560.00" y="238.00" font-size="11" text-anchor="middle" fill="#6b7280">amplifier out</text>
<text x="720.00" y="222.00" font-size="12.5" text-anchor="middle" fill="#c0392b" font-weight="700">+29.8 dBm</text>
<text x="720.00" y="238.00" font-size="11" text-anchor="middle" fill="#6b7280">coupler out</text>
<text x="880.00" y="222.00" font-size="12.5" text-anchor="middle" fill="#c0392b" font-weight="700">+29.8 dBm</text>
<text x="880.00" y="238.00" font-size="11" text-anchor="middle" fill="#6b7280">AOM in</text>
<line x1="768.00" y1="200.00" x2="768.00" y2="290.00" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 3" stroke-linecap="round"/>
<circle cx="768.00" cy="200.00" r="3.5" fill="#6b7280"/>
<rect x="640.00" y="290.00" width="160.00" height="54.00" rx="4" fill="#fff7e0" stroke="#d9770a" stroke-width="1.6"/>
<text x="720.00" y="312.00" font-size="11.5" text-anchor="middle" fill="#1b1f24" font-weight="700">coupled port → scope</text>
<text x="720.00" y="330.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">50 Ω load, +10.5 dBm = 2.12 Vpp</text>
<text x="20.00" y="320.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Supplies and controls for each stage</text>
<line x1="240.00" y1="344.00" x2="240.00" y2="260.00" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/>
<text x="240.00" y="360.00" font-size="11.5" text-anchor="middle" fill="#1b1f24" font-weight="700">TTL gate from the</text>
<text x="240.00" y="376.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">function generator;</text>
<text x="240.00" y="392.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">±5 V from the bias box</text>
<line x1="400.00" y1="344.00" x2="400.00" y2="260.00" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/>
<text x="400.00" y="360.00" font-size="11.5" text-anchor="middle" fill="#1b1f24" font-weight="700">±3 V from the bias box,</text>
<text x="400.00" y="376.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">6 DIP switches set</text>
<text x="400.00" y="392.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">the attenuation</text>
<line x1="560.00" y1="344.00" x2="560.00" y2="260.00" stroke="#6b7280" stroke-width="1.2" stroke-linecap="round"/>
<text x="560.00" y="360.00" font-size="11.5" text-anchor="middle" fill="#1b1f24" font-weight="700">+24 V, 0.9 A each</text>
<text x="560.00" y="376.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">terminal on the amplifier</text>
<text x="560.00" y="392.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">(0.9 A typ per amp)</text>
<rect x="20.00" y="430.00" width="520.00" height="270.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="34.00" y="452.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Power at the AOM (typical gain, synthesizer 0 dBm)</text>
<text x="34.00" y="474.00" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="700">attenuator</text>
<text x="170.00" y="474.00" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="700">amplifier in</text>
<text x="290.00" y="474.00" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="700">amplifier out</text>
<text x="420.00" y="474.00" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="700">in watts</text>
<text x="34.00" y="498.00" font-size="12" text-anchor="start" fill="#1b1f24">31.5 dB</text>
<text x="170.00" y="498.00" font-size="12" text-anchor="start" fill="#1b1f24">-34.3 dBm</text>
<text x="290.00" y="498.00" font-size="12" text-anchor="start" fill="#1b1f24">-1.3 dBm</text>
<text x="420.00" y="498.00" font-size="12" text-anchor="start" fill="#1b1f24">0.001 W</text>
<text x="34.00" y="520.00" font-size="12" text-anchor="start" fill="#1b1f24">16.0 dB</text>
<text x="170.00" y="520.00" font-size="12" text-anchor="start" fill="#1b1f24">-18.8 dBm</text>
<text x="290.00" y="520.00" font-size="12" text-anchor="start" fill="#1b1f24">+14.2 dBm</text>
<text x="420.00" y="520.00" font-size="12" text-anchor="start" fill="#1b1f24">0.026 W</text>
<text x="34.00" y="542.00" font-size="12" text-anchor="start" fill="#1b1f24">8.0 dB</text>
<text x="170.00" y="542.00" font-size="12" text-anchor="start" fill="#1b1f24">-10.8 dBm</text>
<text x="290.00" y="542.00" font-size="12" text-anchor="start" fill="#1b1f24">+22.2 dBm</text>
<text x="420.00" y="542.00" font-size="12" text-anchor="start" fill="#1b1f24">0.166 W</text>
<text x="34.00" y="564.00" font-size="12" text-anchor="start" fill="#1b1f24">4.0 dB</text>
<text x="170.00" y="564.00" font-size="12" text-anchor="start" fill="#1b1f24">-6.8 dBm</text>
<text x="290.00" y="564.00" font-size="12" text-anchor="start" fill="#1b1f24">+26.2 dBm</text>
<text x="420.00" y="564.00" font-size="12" text-anchor="start" fill="#1b1f24">0.417 W</text>
<text x="34.00" y="586.00" font-size="12" text-anchor="start" fill="#1b1f24">0.0 dB</text>
<text x="170.00" y="586.00" font-size="12" text-anchor="start" fill="#1b1f24">-2.8 dBm</text>
<text x="290.00" y="586.00" font-size="12" text-anchor="start" fill="#c0392b" font-weight="700">+30.2 dBm</text>
<text x="420.00" y="586.00" font-size="12" text-anchor="start" fill="#1b1f24">1.047 W</text>
<text x="34.00" y="620.00" font-size="12" text-anchor="start" fill="#1b1f24">amplifier gain 29 dB (min) at A = 0:  +26.2 dBm;   34 dB (max):  +31.2 dBm</text>
<text x="34.00" y="642.00" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="700">coupler read-out (20 dB coupler, 50 Ω scope):</text>
<text x="34.00" y="662.00" font-size="12" text-anchor="start" fill="#1b1f24">  +24 dBm → 1.06 Vpp,   +27 dBm → 1.50 Vpp,   +30 dBm → 2.12 Vpp</text>
<text x="34.00" y="682.00" font-size="11.5" text-anchor="start" fill="#6b7280">P(dBm) = 10·log10( Vpp² / (8 × 50 Ω × 1 mW) ) + 19.5</text>
<rect x="560.00" y="430.00" width="420.00" height="270.00" rx="0" fill="#fff7f7" stroke="#c0392b" stroke-width="1.4"/>
<text x="574.00" y="452.00" font-size="13" text-anchor="start" fill="#c0392b" font-weight="700">Rules that protect the AOM and the amplifier</text>
<text x="574.00" y="474.00" font-size="11.5" text-anchor="start" fill="#1b1f24">1  Synthesizer ≤ 0 dBm, always (the amplifier takes at most +10 dBm,</text>
<text x="574.00" y="492.00" font-size="11.5" text-anchor="start" fill="#1b1f24">    and 0 dBm already gives about +30 dBm out).</text>
<text x="574.00" y="510.00" font-size="11.5" text-anchor="start" fill="#1b1f24">2  Start with the attenuator at 31.5 dB; lower it in steps while</text>
<text x="574.00" y="528.00" font-size="11.5" text-anchor="start" fill="#1b1f24">    watching the diffracted power, and stop at the efficiency plateau.</text>
<text x="574.00" y="546.00" font-size="11.5" text-anchor="start" fill="#1b1f24">3  Never run the amplifier without the AOM (a 50 Ω load) connected:</text>
<text x="574.00" y="564.00" font-size="11.5" text-anchor="start" fill="#1b1f24">    an open output can destroy it.</text>
<text x="574.00" y="582.00" font-size="11.5" text-anchor="start" fill="#1b1f24">4  Check the AOM datasheet for its maximum RF power. G&amp;H lists the</text>
<text x="574.00" y="600.00" font-size="11.5" text-anchor="start" fill="#1b1f24">    saturation power as 1 W (3080-122 at 830 nm; 3080-125 at 633 nm);</text>
<text x="574.00" y="618.00" font-size="11.5" text-anchor="start" fill="#1b1f24">    at 795 nm the 3080-125 needs about 1.6 W (estimate: scales with λ²).</text>
<text x="574.00" y="636.00" font-size="11.5" text-anchor="start" fill="#1b1f24">5  Amplifier on its heatsink, 50 mm free air all round.</text>
<rect x="20.00" y="720.00" width="960.00" height="120.00" rx="0" fill="#fffbe8" stroke="#b58900" stroke-width="1.4"/>
<text x="34.00" y="742.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Frequencies</text>
<text x="34.00" y="764.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Channel A: 80.000 MHz, channel B: 79.965 MHz (phase-locked: one clock inside the SynthHD). Difference 35 kHz; each beam is double-passed, so</text>
<text x="34.00" y="782.00" font-size="11.5" text-anchor="start" fill="#1b1f24">the two light beams differ by 70 kHz = the Zeeman splitting at 50 mG (1.4 kHz per mG).</text>
<text x="34.00" y="804.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Keep the RF cables short (≤ 1 m), SMA, tight. A loose connector reflects power back into the amplifier.</text>
<rect x="20.00" y="854.00" width="960.00" height="34.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="30.00" y="869.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">D8  Level plan</text>
<text x="30.00" y="883.00" font-size="11" text-anchor="start" fill="#6b7280">Synthesizer 0 dBm → switch → attenuator → amplifier (+24 V) → coupler → AOM. The coupler shows the power on a scope; the attenuator sets it.</text>
</svg>
