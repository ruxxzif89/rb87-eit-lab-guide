<text x="250.00" y="644.00" font-size="11.5" text-anchor="middle" fill="#c0392b" font-weight="700">beam Ø10</text>
<line x1="300.00" y1="690.00" x2="425.00" y2="790.00" stroke="#6b7280" stroke-width="1.0" stroke-linecap="round"/>
<circle cx="300.00" cy="690.00" r="2.2" fill="#6b7280"/>
<text x="429.00" y="794.00" font-size="11.5" text-anchor="start" fill="#1b1f24">cell Ø25 (glass)</text>
<line x1="348.00" y1="584.00" x2="440.00" y2="522.00" stroke="#6b7280" stroke-width="1.0" stroke-linecap="round"/>
<circle cx="348.00" cy="584.00" r="2.2" fill="#6b7280"/>
<text x="444.00" y="526.00" font-size="11.5" text-anchor="start" fill="#1b1f24">foam sleeve Ø31.6</text>
<line x1="322.00" y1="515.00" x2="440.00" y2="462.00" stroke="#6b7280" stroke-width="1.0" stroke-linecap="round"/>
<circle cx="322.00" cy="515.00" r="2.2" fill="#6b7280"/>
<text x="444.00" y="466.00" font-size="11.5" text-anchor="start" fill="#1b1f24" font-weight="700">former Ø38 / Ø34</text>
<text x="444.00" y="476.00" font-size="11.5" text-anchor="start" fill="#1b1f24">+ winding to Ø39.1</text>
<line x1="66.00" y1="840.00" x2="66.00" y2="876.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="434.00" y1="840.00" x2="434.00" y2="876.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="66.00" y1="870.00" x2="434.00" y2="870.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="250.00" y="866.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">bore ≥ 46</text>
<text x="250.00" y="892.00" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="700">radial clearance to the winding: 3.45 mm</text>
<text x="560.00" y="440.00" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">What to confirm with the shield maker</text>
<text x="560.00" y="468.00" font-size="12" text-anchor="start" fill="#1b1f24">• innermost bore ≥ Ø46 mm. The BOM line "Ø~70 × 250 mm,</text>
<text x="560.00" y="487.00" font-size="12" text-anchor="start" fill="#1b1f24">   3 layers" gives only the overall size. Three layers and two</text>
<text x="560.00" y="506.00" font-size="12" text-anchor="start" fill="#1b1f24">   gaps would share the 12 mm of radius between Ø46 and Ø70</text>
<text x="560.00" y="525.00" font-size="12" text-anchor="start" fill="#1b1f24">   (gaps of about 4 mm): ask the maker for the real layer sizes.</text>
<text x="560.00" y="544.00" font-size="12" text-anchor="start" fill="#1b1f24">• inner length ≥ 250 mm; end caps with a feed-through of Ø20 mm</text>
<text x="560.00" y="563.00" font-size="12" text-anchor="start" fill="#1b1f24">   (cell cables and the degaussing bundle, D4).</text>
<text x="560.00" y="582.00" font-size="12" text-anchor="start" fill="#1b1f24">• the end caps act like mirrors (high permeability): the field</text>
<text x="560.00" y="601.00" font-size="12" text-anchor="start" fill="#1b1f24">   inside is a little larger and more uniform than the free-space</text>
<text x="560.00" y="620.00" font-size="12" text-anchor="start" fill="#1b1f24">   plot.</text>
<text x="560.00" y="639.00" font-size="12" text-anchor="start" fill="#1b1f24">• calibrate B against the current with the fluxgate (D7), best of all</text>
<text x="560.00" y="658.00" font-size="12" text-anchor="start" fill="#1b1f24">   with the atoms (1.4 kHz per mG): use the calibration, not the formula.</text>
<text x="560.00" y="677.00" font-size="12" text-anchor="start" fill="#1b1f24">• cables leave through the end-cap hole as twisted pairs,</text>
<text x="560.00" y="696.00" font-size="12" text-anchor="start" fill="#1b1f24">   never as loops.</text>
<rect x="20.00" y="904.00" width="960.00" height="34.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="30.00" y="919.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">D1  Fit check</text>
<text x="30.00" y="933.00" font-size="11" text-anchor="start" fill="#6b7280">Shield bore ≥ 46 mm, length ≥ 250 mm: former 160 mm centred, cell in the middle. Confirm the innermost bore of the shield before ordering.</text>
</svg>
