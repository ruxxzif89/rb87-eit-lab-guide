<text x="151.50" y="309.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">45</text>
<line x1="772.00" y1="278.20" x2="772.00" y2="319.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="925.00" y1="278.20" x2="925.00" y2="319.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="772.00" y1="313.00" x2="925.00" y2="313.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="848.50" y="309.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">45</text>
<line x1="920.00" y1="120.00" x2="905.00" y2="103.00" stroke="#6b7280" stroke-width="1.0" stroke-linecap="round"/>
<circle cx="920.00" cy="120.00" r="2.2" fill="#6b7280"/>
<text x="901.00" y="107.00" font-size="11.5" text-anchor="end" fill="#1b1f24">end cap with feed-through (leads, cable)</text>
<text x="250.00" y="400.00" font-size="13" text-anchor="middle" fill="#1b1f24" font-weight="700">End section (scale 8 px per mm)</text>
