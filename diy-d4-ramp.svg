<text x="548.00" y="240.00" font-size="12.5" text-anchor="end" fill="#1b1f24" font-weight="700">peak I</text>
<rect x="20.00" y="450.00" width="960.00" height="180.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="34.00" y="474.00" font-size="11.5" text-anchor="start" fill="#1b1f24">1  Shield closed, degauss coil in place, the solenoid and the cell stack inside (in a first run the fluxgate plate of D7 instead of the cell, sensor</text>
<text x="48.00" y="491.00" font-size="11.5" text-anchor="start" fill="#1b1f24">unpowered), everything non-magnetic.</text>
<text x="34.00" y="514.00" font-size="11.5" text-anchor="start" fill="#1b1f24">2  Variac at zero, switch on, raise slowly while watching the ammeter. The knee is where the current starts to rise much faster than the voltage</text>
<text x="48.00" y="531.00" font-size="11.5" text-anchor="start" fill="#1b1f24">(Twinleaf: saturation shows as a sharp rise of the coil current).</text>
<text x="34.00" y="554.00" font-size="11.5" text-anchor="start" fill="#1b1f24">3  Go to about 1.5 × the knee (our rule of thumb; Twinleaf says only "high enough to ensure saturation"), at most 2 A rms. Hold 5 seconds, then turn</text>
<text x="48.00" y="571.00" font-size="11.5" text-anchor="start" fill="#1b1f24">the knob down steadily to zero in 100–300 seconds (longer is better). Do not stop and do not jerk.</text>
<text x="34.00" y="594.00" font-size="11.5" text-anchor="start" fill="#1b1f24">4  Variac at zero, mains switch off, then unplug the coil from the drive (Twinleaf’s unit disconnects the coil with relays when it is done, so that no</text>
<text x="48.00" y="611.00" font-size="11.5" text-anchor="start" fill="#1b1f24">noise couples into the shield). Repeat once. Then measure (D7) or look at the atoms (EIT line against current).</text>
</svg>
