<text x="78.00" y="240.00" font-size="12.5" text-anchor="end" fill="#1b1f24" font-weight="700">I (rms)</text>
<text x="325.60" y="345.00" font-size="11.5" text-anchor="start" fill="#1b1f24" font-weight="700">start the ramp</text>
<text x="325.60" y="360.00" font-size="11.5" text-anchor="start" fill="#1b1f24">about 1.5 × the knee</text>
<text x="325.60" y="375.00" font-size="11.5" text-anchor="start" fill="#1b1f24">(never above 2 A rms)</text>
