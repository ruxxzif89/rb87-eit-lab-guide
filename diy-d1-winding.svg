<text x="184.00" y="271.00" font-size="11.5" text-anchor="end" fill="#1b1f24">twist with the start lead</text>
<text x="184.00" y="287.00" font-size="11.5" text-anchor="end" fill="#1b1f24">and go to the D9 plug</text>
<rect x="20.00" y="418.00" width="960.00" height="148.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="34.00" y="440.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Where each turn starts (z in mm from the mid-plane, on the 0° line; negative = the cable end). The groove ends at 70.2.</text>
<text x="34.00" y="462.00" font-size="12" text-anchor="start" fill="#1b1f24">Left end turns:   -70.2,  -68.4,  -66.6   (pitch 1.8; the 3.6 pitch starts at -64.8)</text>
<text x="34.00" y="482.00" font-size="12" text-anchor="start" fill="#1b1f24">Uniform turns:    from -64.8 to 61.2 in steps of 3.6 (36 turns)</text>
<text x="34.00" y="502.00" font-size="12" text-anchor="start" fill="#1b1f24">Right end turns: 64.8,  66.6,  68.4   (pitch 1.8, finish at 70.2)</text>
<text x="34.00" y="526.00" font-size="12" text-anchor="start" fill="#1b1f24">Wire 0.50 mm enamelled copper: about 4.98 m in the helix, two return wires of 0.15 m each, leads 0.8 m each.</text>
<text x="34.00" y="546.00" font-size="12" text-anchor="start" fill="#1b1f24">Resistance 0.58 Ω in all (returns in parallel), inductance about 16 µH: no problem for the ITC502.</text>
<rect x="20.00" y="604.00" width="960.00" height="34.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="30.00" y="619.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">D1  Winding plan</text>
<text x="30.00" y="633.00" font-size="11" text-anchor="start" fill="#6b7280">Helix + two return wires 180° apart: the return currents cancel the transverse field on the axis (one wire alone would add 1.0 mG per 10 mA).</text>
</svg>
