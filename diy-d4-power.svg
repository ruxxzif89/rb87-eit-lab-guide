<text x="855.00" y="438.00" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="700">degaussing coil, 30 turns, 0.83 Ω</text>
<text x="855.00" y="455.00" font-size="11.5" text-anchor="middle" fill="#6b7280">(D4 winding on the shield)</text>
<rect x="20.00" y="500.00" width="960.00" height="150.00" rx="0" fill="#fffbe8" stroke="#b58900" stroke-width="1.4"/>
<text x="34.00" y="522.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Sizing</text>
<text x="34.00" y="544.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Series resistor: at 2 A rms it dissipates 18.8 W (4.7 Ω) and the coil 3.3 W: use a 25–50 W wire-wound resistor on a heatsink, away from the shield.</text>
<text x="34.00" y="562.00" font-size="11.5" text-anchor="start" fill="#1b1f24">At 2 A rms the coil loop needs 11.1 V rms: a variac setting of about 106 V out of 230 V, so the useful part is the first third of the knob.</text>
<text x="34.00" y="580.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Fuses: 2 A slow-blow on the mains side, 3.15 A slow-blow on the 24 V side. Never exceed 3 A rms. One 100 s ramp turns about 737 J into heat, nearly all in the resistor.</text>
<text x="34.00" y="598.00" font-size="11.5" text-anchor="start" fill="#1b1f24" font-weight="700">Mains wiring only if you are competent to do it: closed earthed box, cable clamp, no loose conductor. Otherwise use a function generator + DC-coupled power amplifier.</text>
<text x="34.00" y="618.00" font-size="11.5" text-anchor="start" fill="#1b1f24">That alternative works at 1–10 Hz with no mains wiring, and suits thicker shield layers better than 50 Hz.</text>
<rect x="20.00" y="674.00" width="960.00" height="34.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="30.00" y="689.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">D4  Drive schematic</text>
<text x="30.00" y="703.00" font-size="11" text-anchor="start" fill="#6b7280">Mains side: fuse, switch, variac, transformer in an earthed metal box. Coil side: 24 V at most, fused, with a series resistor.</text>
</svg>
