<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">D3 D15 plug wiring for the TEC OUT jack</title><desc id="d">Solder-cup view of the 15-pin plug with the heater pair, the thermistor pair and the ground link.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1"/></pattern><pattern id="hatchf" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#888" stroke-width="0.8"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#999"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b1f24"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="900" fill="#ffffff"/>
<text x="20.00" y="28.00" font-size="17" text-anchor="start" fill="#1b1f24" font-weight="700">D3  The 15-pin plug for TEC OUT (cell heater + thermistor): solder-cup side</text>
<text x="20.00" y="48.00" font-size="12" text-anchor="start" fill="#6b7280">You look at the solder cups from the cable side. Numbers as on the manual (wide row on top). Your plug has the numbers moulded in: the moulded numbers win.</text>
<rect x="97.00" y="188.00" width="526.00" height="124.00" rx="12" fill="#e4e8ee" stroke="#1b1f24" stroke-width="1.8"/>
<circle cx="119.00" cy="250.00" r="9.00" fill="#fff" stroke="#1b1f24" stroke-width="1.6"/>
<circle cx="601.00" cy="250.00" r="9.00" fill="#fff" stroke="#1b1f24" stroke-width="1.6"/>
<polygon points="153.00,204.00 567.00,204.00 547.00,296.00 173.00,296.00" fill="#f7f8fa" stroke="#1b1f24" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="192.00" cy="228.00" r="17.00" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.4"/>
<text x="192.00" y="233.00" font-size="14" text-anchor="middle" fill="#6b7280">8</text>
<circle cx="240.00" cy="228.00" r="17.00" fill="#fff6f0" stroke="#c0392b" stroke-width="2.6"/>
<text x="240.00" y="233.00" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="700">7</text>
<circle cx="288.00" cy="228.00" r="17.00" fill="#fff6f0" stroke="#c0392b" stroke-width="2.6"/>
<text x="288.00" y="233.00" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="700">6</text>
<circle cx="336.00" cy="228.00" r="17.00" fill="#fff6f0" stroke="#c0392b" stroke-width="2.6"/>
<text x="336.00" y="233.00" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="700">5</text>
<circle cx="384.00" cy="228.00" r="17.00" fill="#fff6f0" stroke="#2e7d32" stroke-width="2.6"/>
<text x="384.00" y="233.00" font-size="14" text-anchor="middle" fill="#2e7d32" font-weight="700">4</text>
<circle cx="432.00" cy="228.00" r="17.00" fill="#fff6f0" stroke="#2e7d32" stroke-width="2.6"/>
<text x="432.00" y="233.00" font-size="14" text-anchor="middle" fill="#2e7d32" font-weight="700">3</text>
<circle cx="480.00" cy="228.00" r="17.00" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.4"/>
<text x="480.00" y="233.00" font-size="14" text-anchor="middle" fill="#6b7280">2</text>
<circle cx="528.00" cy="228.00" r="17.00" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.4"/>
<text x="528.00" y="233.00" font-size="14" text-anchor="middle" fill="#6b7280">1</text>
<circle cx="216.00" cy="272.00" r="17.00" fill="#fff6f0" stroke="#1f5fa8" stroke-width="2.6"/>
<text x="216.00" y="277.00" font-size="14" text-anchor="middle" fill="#1f5fa8" font-weight="700">15</text>
<circle cx="264.00" cy="272.00" r="17.00" fill="#fff6f0" stroke="#1f5fa8" stroke-width="2.6"/>
<text x="264.00" y="277.00" font-size="14" text-anchor="middle" fill="#1f5fa8" font-weight="700">14</text>
<circle cx="312.00" cy="272.00" r="17.00" fill="#fff6f0" stroke="#1f5fa8" stroke-width="2.6"/>
<text x="312.00" y="277.00" font-size="14" text-anchor="middle" fill="#1f5fa8" font-weight="700">13</text>
<circle cx="360.00" cy="272.00" r="17.00" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.4"/>
<text x="360.00" y="277.00" font-size="14" text-anchor="middle" fill="#6b7280">12</text>
<circle cx="408.00" cy="272.00" r="17.00" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.4"/>
<text x="408.00" y="277.00" font-size="14" text-anchor="middle" fill="#6b7280">11</text>
<circle cx="456.00" cy="272.00" r="17.00" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.4"/>
<text x="456.00" y="277.00" font-size="14" text-anchor="middle" fill="#6b7280">10</text>
<circle cx="504.00" cy="272.00" r="17.00" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.4"/>
<text x="504.00" y="277.00" font-size="14" text-anchor="middle" fill="#6b7280">9</text>
<polyline points="240.00,211.00 240.00,195.00 336.00,195.00 336.00,211.00" fill="none" stroke="#8a8f95" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/>
<text x="226.00" y="187.00" font-size="11.5" text-anchor="end" fill="#1b1f24" font-weight="700">bare tinned link 7–6–5</text>
<polyline points="216.00,289.00 216.00,305.00 312.00,305.00 312.00,289.00" fill="none" stroke="#8a8f95" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/>
<text x="202.00" y="325.00" font-size="11.5" text-anchor="end" fill="#1b1f24" font-weight="700">bare tinned link 15–14–13</text>
<line x1="288.00" y1="195.00" x2="288.00" y2="130.00" stroke="#c0392b" stroke-width="4.0" stroke-linecap="round"/>
<text x="300.00" y="128.00" font-size="12" text-anchor="start" fill="#c0392b" font-weight="700">heater + (red, to the diode, then the heater)</text>
<line x1="264.00" y1="305.00" x2="264.00" y2="372.00" stroke="#222222" stroke-width="4.0" stroke-linecap="round"/>
<text x="276.00" y="392.00" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="700">heater − (black, to the heater)</text>
<polyline points="384.00,211.00 384.00,160.00 700.00,160.00" fill="none" stroke="#3a7fd0" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="432.00,211.00 432.00,190.00 700.00,190.00" fill="none" stroke="#3a9a4a" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/>
<text x="708.00" y="164.00" font-size="12" text-anchor="start" fill="#3a7fd0" font-weight="700">thermistor + (blue, pin 4)</text>
<text x="708.00" y="194.00" font-size="12" text-anchor="start" fill="#3a9a4a" font-weight="700">thermistor − (green, pin 3)</text>
<polyline points="332.00,305.00 332.00,440.00 700.00,440.00" fill="none" stroke="#999" stroke-width="2.0" stroke-dasharray="5 3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="708.00" y="436.00" font-size="12" text-anchor="start" fill="#6b7280" font-weight="700">cable shield / drain wire</text>
<text x="708.00" y="452.00" font-size="12" text-anchor="start" fill="#6b7280" font-weight="700">to the 15–14–13 link (ground)</text>
<text x="20.00" y="480.00" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">Cable (two cables are easier than one)</text>
<rect x="20.00" y="492.00" width="470.00" height="150.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="34.00" y="514.00" font-size="12" text-anchor="start" fill="#1b1f24">A  heater cable: 2 conductors 0.5 mm² (AWG 20), twisted, red + black.</text>
<text x="34.00" y="534.00" font-size="12" text-anchor="start" fill="#6b7280">    0.6 A at the supply limit (7.2 V), so 0.5 mm² is generous.</text>
<text x="34.00" y="560.00" font-size="12" text-anchor="start" fill="#1b1f24">B  thermistor cable: screened twisted pair, AWG 26 to 24, with drain wire.</text>
<text x="34.00" y="580.00" font-size="12" text-anchor="start" fill="#6b7280">    The shield is connected at the ITC502 end only (to the ground link),</text>
<text x="34.00" y="598.00" font-size="12" text-anchor="start" fill="#6b7280">    never at the cell end: no ground loop through the shield.</text>
<text x="34.00" y="624.00" font-size="12" text-anchor="start" fill="#1b1f24">Length 1–2 m; run both cables as one bundle, twisted together.</text>
<rect x="510.00" y="492.00" width="470.00" height="160.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="524.00" y="514.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Pin table (ITC500 manual, chapter 1.9.2)</text>
<text x="524.00" y="536.00" font-size="11.5" text-anchor="start" fill="#1b1f24">5, 6, 7    TEC element +   → heater + through the diode</text>
<text x="524.00" y="552.00" font-size="11.5" text-anchor="start" fill="#1b1f24">13, 14, 15  TEC element −, ground → heater −, shield drain</text>
<text x="524.00" y="568.00" font-size="11.5" text-anchor="start" fill="#1b1f24">4           thermistor +</text>
<text x="524.00" y="584.00" font-size="11.5" text-anchor="start" fill="#1b1f24">3           thermistor −, ground side</text>
<text x="524.00" y="600.00" font-size="11.5" text-anchor="start" fill="#1b1f24">2, 9        voltage sense (optional): leave open</text>
<text x="524.00" y="616.00" font-size="11.5" text-anchor="start" fill="#1b1f24">1, 8, 10, 11   status LED, AD590: leave open</text>
<text x="524.00" y="632.00" font-size="11.5" text-anchor="start" fill="#1b1f24">12            supply for Thorlabs mounts: DO NOT CONNECT</text>
<rect x="20.00" y="670.00" width="960.00" height="160.00" rx="0" fill="#fffbe8" stroke="#b58900" stroke-width="1.4"/>
<text x="34.00" y="692.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Soldering the plug</text>
<text x="34.00" y="716.00" font-size="11.5" text-anchor="start" fill="#1b1f24">1  Slide the hood and the strain-relief parts over the cable first. Tin every cup you use (3 seconds, no flux running into the plug body).</text>
<text x="34.00" y="736.00" font-size="11.5" text-anchor="start" fill="#1b1f24">2  Make the two links with bare tinned wire and fix them with heat-shrink sleeving so they cannot touch the neighbouring cups.</text>
<text x="34.00" y="756.00" font-size="11.5" text-anchor="start" fill="#1b1f24">3  Solder one conductor into the middle cup of each link (6 and 14), the thermistor pair into 4 and 3, the drain wire to the lower link.</text>
<text x="34.00" y="776.00" font-size="11.5" text-anchor="start" fill="#1b1f24">4  Pull each wire gently: no strand may stand out. Check continuity cup to cup with a meter, and that 4 and 3 are not shorted to anything.</text>
<text x="34.00" y="796.00" font-size="11.5" text-anchor="start" fill="#1b1f24">5  Close the hood with the cable clamp on the outer jacket (not on a single wire). Use a plastic hood: no steel parts near the shield.</text>
<rect x="20.00" y="854.00" width="960.00" height="34.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="30.00" y="869.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">D3  D15 plug</text>
<text x="30.00" y="883.00" font-size="11" text-anchor="start" fill="#6b7280">Two links make three parallel contacts for the 0.6 A heater current (the manual says always connect all three pins). Test it with the dummy loads (next figure).</text>
</svg>
