<text x="30.00" y="40.00" font-size="20" text-anchor="start" fill="#1b1f24" font-weight="700">Rb-87 Zeeman EIT testbed at 795 nm: one laser, two phase-locked AOM arms, one shielded vapour cell</text>
<text x="30.00" y="64.00" font-size="12.5" text-anchor="start" fill="#6b7280">Block diagram of the planned bench. Light paths: laser (brown), control (blue), probe (red), both together (purple); electrical links dashed.</text>
