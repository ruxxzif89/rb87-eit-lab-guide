<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">Rb-87 Zeeman EIT project overview</title><desc id="d">Block diagram of the Rb-87 Zeeman EIT bench: a DFB laser locked by saturated absorption spectroscopy, control and probe arms with double-pass AOMs driven by a two-channel RF synthesizer, the vapour cell in a solenoid and a three-layer mu-metal shield, polarization filtering and detection, with an inset of the Lambda level scheme.</desc>
