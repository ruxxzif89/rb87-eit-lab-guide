<text x="1327.00" y="228.00" font-size="11.5" text-anchor="middle" fill="#1b1f24" font-weight="700">oscilloscope:</text>
<text x="1327.00" y="243.00" font-size="11.5" text-anchor="middle" fill="#6b7280">EIT transmission peak</text>
<rect x="820.00" y="400.00" width="560.00" height="360.00" rx="8" fill="#fbfbfd" stroke="#e4e8ee" stroke-width="1.2"/>
<text x="836.00" y="426.00" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">The Λ system (Rb-87 D1, F = 2 → F′ = 1)</text>
<line x1="1030.00" y1="490.00" x2="1170.00" y2="490.00" stroke="#1b1f24" stroke-width="3" stroke-linecap="round"/>
<text x="1180.00" y="495.00" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="700">F′ = 1, m = 0</text>
<line x1="880.00" y1="670.00" x2="980.00" y2="670.00" stroke="#1b1f24" stroke-width="3" stroke-linecap="round"/>
<line x1="1220.00" y1="660.00" x2="1320.00" y2="660.00" stroke="#1b1f24" stroke-width="3" stroke-linecap="round"/>
<text x="930.00" y="696.00" font-size="12.5" text-anchor="middle" fill="#1b1f24" font-weight="700">F = 2, m = −1</text>
<text x="1270.00" y="686.00" font-size="12.5" text-anchor="middle" fill="#1b1f24" font-weight="700">F = 2, m = +1</text>
<path d="M 950.0 666.0 L 1082.0 496.0" fill="none" stroke="#1f5fa8" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/>
<path d="M 1250.0 656.0 L 1118.0 496.0" fill="none" stroke="#c0392b" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/>
<text x="948.00" y="568.00" font-size="13" text-anchor="start" fill="#1f5fa8" font-weight="700">control σ⁺</text>
<text x="1172.00" y="568.00" font-size="13" text-anchor="start" fill="#c0392b" font-weight="700">probe σ⁻</text>
<text x="836.00" y="718.00" font-size="12" text-anchor="start" fill="#1b1f24">The ground states differ by the Zeeman shift (1.4 kHz per mG): about 70 kHz at 50 mG,</text>
<text x="836.00" y="736.00" font-size="12" text-anchor="start" fill="#1b1f24">matched by the AOM frequency difference. On two-photon resonance the atoms fall into</text>
<text x="836.00" y="754.00" font-size="12" text-anchor="start" fill="#1b1f24">a dark state: the probe passes (EIT), slows down and can be stored and retrieved.</text>
<rect x="30.00" y="560.00" width="760.00" height="200.00" rx="8" fill="#f7f8fa" stroke="#e4e8ee" stroke-width="1.2"/>
<text x="46.00" y="588.00" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">Key numbers of the design</text>
<text x="46.00" y="616.00" font-size="12.5" text-anchor="start" fill="#1b1f24">Wavelength 794.978 nm (Rb-87 D1); laser locked by saturated absorption near F = 2 → F′ = 1.</text>
<text x="46.00" y="639.00" font-size="12.5" text-anchor="start" fill="#1b1f24">Each beam passes its AOM twice: 2 × 80 MHz. The EIT beams run 160 MHz off the one-photon resonance (−1 orders).</text>
<text x="46.00" y="662.00" font-size="12.5" text-anchor="start" fill="#1b1f24">Control about 1 mW at the cell, probe under 1 µW; orthogonal circular polarizations from one λ/4 plate.</text>
<text x="46.00" y="685.00" font-size="12.5" text-anchor="start" fill="#1b1f24">Cell Ø25 mm, 25 mm path, enriched Rb-87 with 10 Torr neon, heated to about 60 °C.</text>
<text x="46.00" y="708.00" font-size="12.5" text-anchor="start" fill="#1b1f24">Solenoid about 50 mG, uniform to 0.2 % over the cell; shield and degaussing remove the lab field.</text>
<text x="46.00" y="731.00" font-size="12.5" text-anchor="start" fill="#1b1f24">Beam height 100 mm above the breadboard for every part.</text>
</svg>
