<style>

</style>
<title>3D Bench · Rb-87 EIT Lab Guide</title>
<meta name="description" content="Full-page 3D optical bench simulator for the Rb-87 Zeeman-EIT experiment: build, trace the beams, lock the laser and see the EIT signal.">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3f0; --surface:#ffffff; --surface-2:#e7e9e4; --surface-3:#dde0da;
  --ink:#14181c; --ink-2:#3d454d; --muted:#626b73; --rule:#c6cbc4; --rule-strong:#9aa19a;
  --accent:#0d5a78; --accent-ink:#ffffff; --accent-soft:#d7e8ef;
  --laser:#c40f2b; --laser-soft:#f7dde1; --laser-glow:rgba(196,15,43,.22);
  --warn:#8a5200; --warn-bg:#fdf1d8; --warn-rule:#e2b45e;
  --ok:#1b6a39; --ok-bg:#e0f1e6; --bad:#a3192c; --bad-bg:#f8e1e4;
  --code-bg:#eaece7; --focus:#0d5a78; --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px -10px rgba(0,0,0,.25);
  --ana:#6a4a94; --ana-bg:#f3eef9; --ana-rule:#cdbde3; --chart-grid:#d8dcd6; --chart-a:#c40f2b; --chart-b:#0d5a78; --chart-c:#7a5c00; --chart-d:#4c5a66;
  --sim-bg:#d9ddd9; --sim-table:#a9afb3; --sim-table-edge:#8a9095; --sim-hole:#61686e; --sim-metal:#c9ced2; --sim-dark:#2b3036;
  --sim-glass:#9fd0e6; --sim-beam:#ff2236; --sim-accent:#0d5a78; --sim-select:#e0a100; --sim-label:#14181c; --sim-label-bg:#ffffffd9;
  --font-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f12; --surface:#141a1f; --surface-2:#1a2128; --surface-3:#222b33;
    --ink:#e2e7ea; --ink-2:#b9c2c9; --muted:#8a959e; --rule:#2a343c; --rule-strong:#44515b;
    --accent:#5db3d6; --accent-ink:#06131a; --accent-soft:#16303c;
    --laser:#ff5468; --laser-soft:#3a1519; --laser-glow:rgba(255,84,104,.25);
    --warn:#f2b54f; --warn-bg:#2a2010; --warn-rule:#6e5320;
    --ok:#73d396; --ok-bg:#12271a; --bad:#ff7d8c; --bad-bg:#2e1418;
    --code-bg:#182027; --focus:#7cc8e6; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8);
    --ana:#bfa3e8; --ana-bg:#1d1828; --ana-rule:#3f3355; --chart-grid:#26313a; --chart-a:#ff5468; --chart-b:#5db3d6; --chart-c:#e3b341; --chart-d:#9aa7b2;
    --sim-bg:#0b0e11; --sim-table:#252b31; --sim-table-edge:#1a1f24; --sim-hole:#0a0c0f; --sim-metal:#8d969e; --sim-dark:#15191d;
    --sim-glass:#6fb7d6; --sim-beam:#ff3046; --sim-accent:#5db3d6; --sim-select:#f2c14e; --sim-label:#e2e7ea; --sim-label-bg:#141a1fd9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0c0f12; --surface:#141a1f; --surface-2:#1a2128; --surface-3:#222b33;
    --ink:#e2e7ea; --ink-2:#b9c2c9; --muted:#8a959e; --rule:#2a343c; --rule-strong:#44515b;
    --accent:#5db3d6; --accent-ink:#06131a; --accent-soft:#16303c;
    --laser:#ff5468; --laser-soft:#3a1519; --laser-glow:rgba(255,84,104,.25);
    --warn:#f2b54f; --warn-bg:#2a2010; --warn-rule:#6e5320;
    --ok:#73d396; --ok-bg:#12271a; --bad:#ff7d8c; --bad-bg:#2e1418;
    --code-bg:#182027; --focus:#7cc8e6; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.8);
    --ana:#bfa3e8; --ana-bg:#1d1828; --ana-rule:#3f3355; --chart-grid:#26313a; --chart-a:#ff5468; --chart-b:#5db3d6; --chart-c:#e3b341; --chart-d:#9aa7b2;
    --sim-bg:#0b0e11; --sim-table:#252b31; --sim-table-edge:#1a1f24; --sim-hole:#0a0c0f; --sim-metal:#8d969e; --sim-dark:#15191d;
    --sim-glass:#6fb7d6; --sim-beam:#ff3046; --sim-accent:#5db3d6; --sim-select:#f2c14e; --sim-label:#e2e7ea; --sim-label-bg:#141a1fd9;
    color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img,svg,canvas,video{max-width:100%}
:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h,44px) + 10px)}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16.5px;line-height:1.62;overflow-x:hidden}
a{color:var(--accent);text-underline-offset:2px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
button,input,select{font:inherit;color:inherit}
code,kbd,.mono{font-family:var(--font-mono);font-size:.88em}
code{background:var(--code-bg);padding:.08em .32em;border-radius:3px}
kbd{border:1px solid var(--rule-strong);border-bottom-width:2px;border-radius:3px;padding:0 .3em;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.12;letter-spacing:.01em;margin:0}
h2{font-size:clamp(1.9rem,1.4rem + 1.8vw,2.6rem);font-weight:700;text-transform:uppercase}
h3{font-size:1.45rem;font-weight:600;margin-top:2.2rem;margin-bottom:.5rem}
h4{font-size:1.15rem;font-weight:600;margin-top:1.4rem;margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
p{margin:.7rem 0}
ul,ol{padding-left:1.3rem}
li{margin:.25rem 0}
li::marker{color:var(--muted)}
hr{border:0;border-top:1px solid var(--rule)}
.wrap{padding-inline:16px;padding-block:0;max-width:1440px;margin-inline:auto}
@media (min-width:720px){.wrap{padding-inline:28px}}

/* ---------- datasheet header ---------- */
.masthead{border-bottom:2px solid var(--ink);background:var(--surface)}
.masthead .wrap{padding-block:18px 22px}
.docbar{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--font-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:10px}
.docbar b{color:var(--ink);font-weight:600}
.docbar .sp{flex:1}
.theme-btn{border:1px solid var(--rule-strong);background:var(--surface-2);border-radius:3px;padding:2px 8px;cursor:pointer;font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:end;padding-top:20px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(2.4rem,1.6rem + 4vw,4.6rem);font-weight:700;text-transform:uppercase;line-height:.95;letter-spacing:.005em}
.hero h1 .wl{color:var(--laser)}
.hero .lede{font-size:1.08rem;color:var(--ink-2);max-width:62ch;margin-top:14px}
.spec{border:1px solid var(--rule-strong);background:var(--surface);font-size:.86rem}
.spec dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr)}
.spec dt,.spec dd{margin:0;padding:6px 10px;border-bottom:1px solid var(--rule)}
.spec dt{font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-right:1px solid var(--rule);white-space:nowrap}
.spec dd{font-family:var(--font-mono);font-size:.82rem}
.spec dl > :nth-last-child(-n+2){border-bottom:0}
.beamline{height:3px;background:linear-gradient(90deg,transparent,var(--laser) 12%,var(--laser) 88%,transparent);box-shadow:0 0 12px var(--laser-glow);margin-top:18px;opacity:.85}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:40px;padding-block:28px 60px}
@media (max-width:1020px){.layout{grid-template-columns:minmax(0,1fr);gap:16px}}
.toc{position:sticky;top:calc(var(--nav-h,44px) + 12px);align-self:start;max-height:calc(100vh - var(--nav-h,44px) - 24px);overflow:auto;font-size:.88rem;border-left:2px solid var(--ink);padding-left:12px}
.toc .toc-h{font-family:var(--font-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.toc ol{list-style:none;padding:0;margin:0}
.toc li{margin:0}
.toc a{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:2px;padding:3px 4px;color:var(--ink-2);text-decoration:none;border-radius:2px}
.toc a .n{font-family:var(--font-mono);color:var(--muted);font-size:.78rem;padding-top:1px}
.toc a:hover{background:var(--surface-2);color:var(--ink)}
.toc a.active{color:var(--ink);background:var(--surface-2);box-shadow:inset 2px 0 0 var(--laser)}
.toc ol ol a{padding-left:1.4em;font-size:.82rem}
.toc details summary{display:none}
@media (max-width:1020px){
  .toc{position:static;max-height:none;border:1px solid var(--rule-strong);padding:0;background:var(--surface)}
  .toc details summary{display:block;cursor:pointer;padding:10px 12px;font-family:var(--font-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
  .toc details > div{padding:0 12px 12px}
  .toc .toc-h{display:none}
}
main{min-width:0}
section.part{padding-top:26px;margin-top:30px;border-top:2px solid var(--ink)}
section.part:first-of-type{margin-top:0}
.part-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:baseline;margin-bottom:10px}
.part-num{font-family:var(--font-mono);font-size:.8rem;color:var(--laser);letter-spacing:.08em;border:1px solid var(--laser);padding:1px 6px;border-radius:2px;align-self:center}
.part-sub{grid-column:2;color:var(--muted);font-size:.95rem;margin:0}
.prose{max-width:76ch}
.cols-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:760px){.cols-2{grid-template-columns:minmax(0,1fr)}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin:14px 0}
.card{background:var(--surface);border:1px solid var(--rule);padding:12px 14px;border-radius:3px;min-width:0}
.card h4{margin-top:0;font-size:1rem}
.card .k{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .v{font-family:var(--font-display);font-size:1.7rem;font-weight:600;line-height:1.1}
.note,.warnbox,.okbox,.gapbox{border:1px solid var(--rule);border-left:4px solid var(--accent);background:var(--surface);padding:10px 14px;margin:14px 0;border-radius:2px;font-size:.95rem}
.note .t,.warnbox .t,.okbox .t,.gapbox .t{font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;display:block;margin-bottom:2px;color:var(--muted)}
.warnbox{border-left-color:var(--warn);background:var(--warn-bg)}
.warnbox .t{color:var(--warn)}
.okbox{border-left-color:var(--ok);background:var(--ok-bg)}
.gapbox{border-left-color:var(--laser);background:var(--laser-soft)}
.gapbox .t{color:var(--laser)}
.tag{display:inline-block;font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:0 5px;border:1px solid currentColor;border-radius:2px;vertical-align:1px;white-space:nowrap}
.tag.est{color:var(--warn)}
.tag.src{color:var(--ok)}
.tag.gap{color:var(--laser)}
.tag.ver{color:var(--accent)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.9rem;background:var(--surface)}
th,td{border:1px solid var(--rule);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--surface-2);font-family:var(--font-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
td.num{font-family:var(--font-mono);white-space:nowrap}
caption{caption-side:bottom;text-align:left;color:var(--muted);font-size:.8rem;padding-top:6px}
.eq{overflow-x:auto;overflow-y:hidden;margin:10px 0;padding:6px 10px;background:var(--surface);border:1px solid var(--rule);border-radius:2px;position:relative}
.eq .src{position:absolute;right:6px;top:4px;font-family:var(--font-mono);font-size:.66rem;color:var(--muted)}
mjx-container{max-width:100%}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;margin:.4em 0!important}
figure{margin:16px 0}
figcaption{font-size:.84rem;color:var(--muted);margin-top:6px}
.fig{background:var(--surface);border:1px solid var(--rule);padding:10px;border-radius:2px}
svg.diag{display:block;width:100%;height:auto;max-width:100%}
svg.diag text{font-family:var(--font-mono);fill:var(--ink)}
svg.diag .muted{fill:var(--muted)}
svg.diag .lv{stroke:var(--ink);stroke-width:2.4}
svg.diag .lvm{stroke:var(--ink-2);stroke-width:2}
svg.diag .ctl{stroke:var(--laser);stroke-width:3;fill:none}
svg.diag .prb{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:7 5;fill:none}
svg.diag .rule{stroke:var(--rule-strong);stroke-width:1}
svg.diag .box{fill:var(--surface-2);stroke:var(--ink-2);stroke-width:1.2}
svg.diag .boxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
svg.diag .boxl{fill:var(--laser-soft);stroke:var(--laser);stroke-width:1.2}
svg.diag .beam{stroke:var(--laser);stroke-width:2.5;fill:none}
svg.diag .beamp{stroke:var(--accent);stroke-width:2;fill:none;stroke-dasharray:6 4}
svg.diag .sig{stroke:var(--ink);stroke-width:2;fill:none}
svg.diag .sigc{stroke:var(--laser);stroke-width:2.2;fill:none}
svg.diag .sigp{stroke:var(--accent);stroke-width:2.2;fill:none}
svg.diag .fillc{fill:var(--laser-soft)}
svg.diag .grid{stroke:var(--chart-grid);stroke-width:1}

/* ---------- glossary ---------- */
.gl-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;position:sticky;top:var(--nav-h,44px);background:var(--bg);padding:8px 0;z-index:2;border-bottom:1px solid var(--rule)}
.gl-tools input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--rule-strong);background:var(--surface);padding:7px 10px;border-radius:3px}
.chip{border:1px solid var(--rule-strong);background:var(--surface);border-radius:2px;padding:3px 9px;font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gl-count{font-family:var(--font-mono);font-size:.75rem;color:var(--muted)}
dl.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px;margin:0}
dl.gloss > div{background:var(--surface);border:1px solid var(--rule);padding:9px 12px;border-radius:2px;min-width:0}
dl.gloss dt{font-weight:600;font-family:var(--font-body)}
dl.gloss dt .c{float:right;font-family:var(--font-mono);font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500;margin-top:4px}
dl.gloss dd{margin:3px 0 0;font-size:.9rem;color:var(--ink-2)}
dl.gloss > div[hidden]{display:none}

/* ---------- interactive charts ---------- */
.lab{background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;padding:12px;margin:18px 0;box-shadow:var(--shadow)}
.lab-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:8px}
.lab-h b{font-family:var(--font-display);font-size:1.15rem;text-transform:uppercase;letter-spacing:.03em}
.lab-h span{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
.lab-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px}
@media (max-width:760px){.lab-grid{grid-template-columns:minmax(0,1fr)}}
.lab canvas{width:100%;height:300px;display:block;background:var(--surface)}
.ctrl{display:grid;gap:10px;align-content:start}
.ctrl label{display:grid;gap:2px;font-size:.82rem}
.ctrl label .lt{display:flex;justify-content:space-between;gap:8px;font-family:var(--font-mono);font-size:.74rem;color:var(--ink-2)}
.ctrl output{font-family:var(--font-mono);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--laser);min-width:0}
.readout{font-family:var(--font-mono);font-size:.76rem;background:var(--surface-2);border:1px solid var(--rule);padding:6px 8px;border-radius:2px;line-height:1.5}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-family:var(--font-mono);font-size:.72rem;color:var(--ink-2);margin-top:4px}
.legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:4px}

/* ---------- simulator ---------- */
.sim{border:2px solid var(--ink);background:var(--surface);margin-top:14px}
.sim-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--rule-strong);background:var(--surface-2)}
.btn{border:1px solid var(--rule-strong);background:var(--surface);padding:5px 10px;border-radius:2px;cursor:pointer;font-size:.82rem;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sim-bar .sp{flex:1}
.sim-status{font-family:var(--font-mono);font-size:.72rem;display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--rule-strong);padding:1px 7px;border-radius:10px;background:var(--surface);white-space:nowrap}
.pill.on{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.pill.off{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.pill.mid{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.sim-main{display:grid;grid-template-columns:170px minmax(0,1fr) 290px;min-height:0}
.palette{border-right:1px solid var(--rule-strong);overflow:auto;max-height:70vh;padding:6px;background:var(--surface)}
.palette h4{font-size:.72rem;font-family:var(--font-mono);margin:8px 2px 4px;color:var(--muted);letter-spacing:.1em}
.pal-item{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;align-items:center;width:100%;text-align:left;border:1px solid var(--rule);background:var(--surface-2);border-radius:2px;padding:4px 6px;margin-bottom:4px;cursor:grab;font-size:.78rem;line-height:1.15;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.pal-item:hover{border-color:var(--ink)}
.pal-item .ic{width:26px;height:22px;display:grid;place-items:center;font-family:var(--font-mono);font-size:.62rem;font-weight:600;border:1px solid var(--rule-strong);background:var(--surface);border-radius:2px}
.pal-item.na{opacity:.7}
.pal-item small{display:block;color:var(--muted);font-size:.66rem}
.stage{position:relative;height:70vh;min-height:420px;background:var(--sim-bg);overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.stage:focus-within{box-shadow:inset 0 0 0 2px var(--focus)}
.stage-msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;font-size:.95rem;color:var(--ink-2)}
.stage-msg.show{display:grid}
.stage-hud{position:absolute;left:8px;bottom:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;font-family:var(--font-mono);font-size:.7rem}
.stage-hud .h{background:var(--sim-label-bg);border:1px solid var(--rule);padding:2px 6px;border-radius:2px;color:var(--ink)}

.tour{position:absolute;left:10px;bottom:44px;max-width:min(380px,calc(100% - 20px));background:var(--surface);border:2px solid var(--ink);padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:6;font-size:.84rem}

.objs li .bx{width:18px;height:18px;border:1.5px solid var(--rule-strong);border-radius:2px;display:grid;place-items:center;font-family:var(--font-mono);font-size:.62rem;color:var(--muted)}
.objs li.done .bx{background:var(--ok);border-color:var(--ok);color:var(--surface)}

.steps{counter-reset:s;list-style:none;padding:0}

        <canvas id="scopeCanvas" aria-label="Simulated oscilloscope trace" role="img"></canvas>
        <div class="row" id="storeCtrls" hidden style="margin-top:6px">
          <label for="scTau">Storage time τ <output id="scTauO" for="scTau">20 µs</output> <input type="range" id="scTau" min="0" max="600" step="5" value="20"></label>
          <button type="button" class="btn primary" id="scRun">Run storage sequence</button>
        </div>
        <div class="readout" id="scopeRead"></div>
      </div>
      <div class="objs">
        <div class="scope-h"><b>Objectives</b><span class="score" id="objScore"></span></div>
        <ol id="objList"></ol>
        <div class="hint" id="hintBox" hidden></div>
        <ul class="warnlist" id="warnList"></ul>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var root = document.documentElement, tb = document.getElementById('themeBtn'), modes = ['auto', 'light', 'dark'];
  var themeListeners = [];
  window.onThemeChange = function (fn) { themeListeners.push(fn); };
  function fireTheme() { themeListeners.forEach(function (f) { try { f(); } catch (e) { console.error(e); } }); }
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', fireTheme); } catch (e) { }
  new MutationObserver(fireTheme).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  function curMode() { var t = root.getAttribute('data-theme'); return t === 'light' || t === 'dark' ? t : 'auto'; }
  function paintBtn() { if (tb) tb.textContent = 'Theme: ' + curMode(); }
  if (tb) tb.addEventListener('click', function () {
    var m = modes[(modes.indexOf(curMode()) + 1) % 3];
    if (m === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', m);
    try { localStorage.setItem('rb87-theme', m); } catch (e) { }
    paintBtn();
  });
  try { var saved = localStorage.getItem('rb87-theme'); if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved); } catch (e) { }
  paintBtn();
  /* the toolbar height decides how tall the 3D view can be */
  function ah() { root.style.setProperty('--app-h', window.innerHeight + 'px'); } ah(); window.addEventListener('resize', ah);
  var bar = document.querySelector('.sim-bar');
  function bh() { if (bar) root.style.setProperty('--bar-h', bar.offsetHeight + 'px'); }
  bh(); window.addEventListener('resize', bh); window.addEventListener('load', bh); if (window.ResizeObserver && bar) new ResizeObserver(bh).observe(bar);
  var pb = document.getElementById('benchPanels');
  if (pb) pb.addEventListener('click', function () {
    var on = !document.body.classList.contains('nopanels'); document.body.classList.toggle('nopanels', on);
    pb.setAttribute('aria-pressed', on ? 'true' : 'false'); pb.textContent = on ? 'Show side panels' : 'Hide side panels';
    window.dispatchEvent(new Event('resize'));
  });
})();
</script>
