<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1136" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">D9 AOM yaw platform drawing</title><desc id="d">Top view and side view of the home-made AOM yaw platform with a micrometer on an 80 millimetre lever arm.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1"/></pattern><pattern id="hatchf" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#888" stroke-width="0.8"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#999"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b1f24"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="1136" fill="#ffffff"/>
<text x="20.00" y="28.00" font-size="17" text-anchor="start" fill="#1b1f24" font-weight="700">D9  AOM yaw platform: micrometer on an 80 mm lever, to set the Bragg angle to 0.1 mrad</text>
<text x="20.00" y="48.00" font-size="12" text-anchor="start" fill="#6b7280">Aluminium, all dimensions in mm, top and side views at 4 px per mm. Read the AOM size (A × B × C) from your AOM drawing: this sheet cannot give it.</text>
<text x="80.00" y="112.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Top view</text>
