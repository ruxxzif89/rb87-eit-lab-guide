<rect x="82.00" y="202.00" width="596.00" height="276.00" rx="0" fill="#f5f6f8" stroke="none" stroke-width="0"/>
<text x="86.00" y="496.00" font-size="11.5" text-anchor="start" fill="#6b7280">base plate 150 × 70 × 10, M6 holes on the 25 mm grid</text>
<rect x="140.00" y="240.00" width="240.00" height="200.00" rx="0" fill="#d7dce2" stroke="#1b1f24" stroke-width="1.6"/>
<rect x="380.00" y="316.00" width="200.00" height="48.00" rx="0" fill="#d7dce2" stroke="#1b1f24" stroke-width="1.6"/>
<rect x="172.00" y="284.00" width="176.00" height="112.00" rx="2" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="260.00" y="301.00" font-size="12" text-anchor="middle" fill="#1f5fa8" font-weight="700">AOM  A × B</text>
<circle cx="260.00" cy="340.00" r="24.00" fill="none" stroke="#1b1f24" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="260.00" cy="340.00" r="8.00" fill="#b8892b" stroke="#1b1f24" stroke-width="1.0"/>
<text x="260.00" y="376.00" font-size="11" text-anchor="middle" fill="#1b1f24">pivot (under the AOM)</text>
<rect x="248.00" y="396.00" width="24.00" height="32.00" rx="0" fill="#b8892b" stroke="#1b1f24" stroke-width="1.0"/>
<text x="280.00" y="426.00" font-size="11" text-anchor="start" fill="#1b1f24" font-weight="700">SMA</text>
<line x1="30.00" y1="340.00" x2="172.00" y2="340.00" stroke="#c0392b" stroke-width="2.0" stroke-linecap="round"/>
<text x="32.00" y="332.00" font-size="11.5" text-anchor="start" fill="#c0392b" font-weight="700">beam →</text>
<rect x="532.00" y="104.00" width="96.00" height="96.00" rx="2" fill="#fff7e0" stroke="#d9770a" stroke-width="1.6"/>
<text x="580.00" y="96.00" font-size="11.5" text-anchor="middle" fill="#d9770a" font-weight="700">micrometer 0–13 mm, flat tip</text>
<rect x="520.00" y="202.00" width="120.00" height="36.00" rx="0" fill="#d7dce2" stroke="#1b1f24" stroke-width="1.4"/>
<text x="580.00" y="224.00" font-size="11" text-anchor="middle" fill="#1b1f24">clamp bracket</text>
<line x1="580.00" y1="238.00" x2="580.00" y2="316.00" stroke="#d9770a" stroke-width="2.4" stroke-linecap="round"/>
<text x="570.00" y="272.00" font-size="11.5" text-anchor="end" fill="#d9770a" font-weight="700">spindle pushes the tail</text>
<rect x="564.00" y="384.00" width="32.00" height="56.00" rx="0" fill="#fff" stroke="#1b1f24" stroke-width="1.4"/>
<path d="M 580.0 366.0 q 6 5 0 10 q -6 5 0 10 q 6 5 0 10" fill="none" stroke="#1b1f24" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="554.00" y="404.00" font-size="11.5" text-anchor="end" fill="#1b1f24" font-weight="700">spring plunger or</text>
<text x="554.00" y="420.00" font-size="11.5" text-anchor="end" fill="#1b1f24" font-weight="700">small tension spring</text>
<line x1="260.00" y1="480.00" x2="260.00" y2="530.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="580.00" y1="480.00" x2="580.00" y2="530.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="260.00" y1="524.00" x2="580.00" y2="524.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="420.00" y="520.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">lever arm 80</text>
<line x1="80.00" y1="480.00" x2="80.00" y2="560.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="680.00" y1="480.00" x2="680.00" y2="560.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="80.00" y1="554.00" x2="680.00" y2="554.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="380.00" y="550.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">150</text>
<line x1="680.00" y1="200.00" x2="716.00" y2="200.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="680.00" y1="480.00" x2="716.00" y2="480.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="710.00" y1="200.00" x2="710.00" y2="480.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="715.00" y="344.00" font-size="11.5" text-anchor="start" fill="#1b1f24">70</text>
<line x1="140.00" y1="240.00" x2="140.00" y2="212.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="380.00" y1="240.00" x2="380.00" y2="212.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="140.00" y1="218.00" x2="380.00" y2="218.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="260.00" y="214.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">carrier 60 × 50 × 6</text>
<text x="80.00" y="596.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Side view</text>
<rect x="80.00" y="760.00" width="600.00" height="40.00" rx="0" fill="url(#hatch)" stroke="#1b1f24" stroke-width="1.2"/>
<rect x="140.00" y="734.00" width="240.00" height="24.00" rx="0" fill="#d7dce2" stroke="#1b1f24" stroke-width="1.4"/>
<circle cx="260.00" cy="747.00" r="8.00" fill="#b8892b" stroke="#1b1f24" stroke-width="1.0"/>
<rect x="172.00" y="678.00" width="176.00" height="56.00" rx="2" fill="#e8f1fb" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="260.00" y="696.00" font-size="12" text-anchor="middle" fill="#1f5fa8" font-weight="700">AOM</text>
<line x1="40.00" y1="706.00" x2="720.00" y2="706.00" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="8 4" stroke-linecap="round"/>
<text x="718.00" y="700.00" font-size="11.5" text-anchor="end" fill="#c0392b" font-weight="700">beam</text>
<rect x="236.00" y="800.00" width="48.00" height="40.00" rx="0" fill="#c9d0d6" stroke="#1b1f24" stroke-width="1.2"/>
<text x="298.00" y="828.00" font-size="11.5" text-anchor="start" fill="#1b1f24">post Ø12.7 on a post holder</text>
<line x1="80.00" y1="760.00" x2="60.00" y2="760.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="80.00" y1="800.00" x2="60.00" y2="800.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="66.00" y1="760.00" x2="66.00" y2="800.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="61.00" y="784.00" font-size="11.5" text-anchor="end" fill="#1b1f24">10</text>
<line x1="80.00" y1="734.00" x2="34.00" y2="734.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="80.00" y1="758.00" x2="34.00" y2="758.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="40.00" y1="734.00" x2="40.00" y2="758.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="35.00" y="750.00" font-size="11.5" text-anchor="end" fill="#1b1f24">6</text>
<rect x="20.00" y="850.00" width="960.00" height="220.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="34.00" y="874.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Numbers</text>
<text x="34.00" y="898.00" font-size="11.5" text-anchor="start" fill="#1b1f24">One micrometer division (10 µm) on the 80 mm lever turns the AOM by 0.125 mrad. The Bragg angle at 795 nm and 80 MHz is 7.57 mrad (0.43°): 0.61 mm of</text>
<text x="34.00" y="913.00" font-size="11.5" text-anchor="start" fill="#1b1f24">micrometer travel.</text>
<text x="34.00" y="930.00" font-size="11.5" text-anchor="start" fill="#1b1f24">The angular acceptance of a 1.5 mm beam is about λ/D = 0.53 mrad, so the micrometer resolves it about four times over: enough to find the efficiency</text>
<text x="34.00" y="945.00" font-size="11.5" text-anchor="start" fill="#1b1f24">maximum by hand.</text>
<text x="34.00" y="962.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Range: the 13 mm head gives ± 81 mrad (± 4.7°) of yaw, far more than the ± 1° needed. Lock the micrometer with its clamp, never with a steel set screw</text>
<text x="34.00" y="977.00" font-size="11.5" text-anchor="start" fill="#1b1f24">near the cell.</text>
<text x="34.00" y="994.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Height: the AOM aperture must sit at the beam height. Add Al shims under the carrier (0.5 and 1 mm) instead of moving the post.</text>
<text x="34.00" y="1011.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Alternative with parts we own: put the carrier on the Thorlabs PR01/M rotation stage (inventory I18). Its vernier steps are coarse (the 5 arc-minute</text>
<text x="34.00" y="1026.00" font-size="11.5" text-anchor="start" fill="#1b1f24">class is 1.45 mrad, a fifth of the Bragg angle), so add the micrometer lever anyway.</text>
<text x="34.00" y="1043.00" font-size="11.5" text-anchor="start" fill="#1b1f24">The PR01/M dimensions and hole pattern were not found: measure the stage before drilling the adapter plate.</text>
<rect x="20.00" y="1090.00" width="960.00" height="34.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="30.00" y="1105.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">D9  AOM yaw platform</text>
<text x="30.00" y="1119.00" font-size="11" text-anchor="start" fill="#6b7280">Base 150 × 70 × 10, carrier 60 × 50 × 6 with an 80 mm tail, brass pivot, 0–13 mm micrometer. Mount the SMA connector with a short flexible cable.</text>
</svg>
