<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">D6 divider between the lock box and the ITC502</title><desc id="d">Resistor divider 91 kilo-ohm and 1 kilo-ohm with BNC connectors, the box drawing and the numbers.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1"/></pattern><pattern id="hatchf" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#888" stroke-width="0.8"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#999"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b1f24"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="880" fill="#ffffff"/>
<text x="20.00" y="28.00" font-size="17" text-anchor="start" fill="#1b1f24" font-weight="700">D6  Lock-box divider: 100 : 1 between the Red Pitaya output and the ITC502 modulation input</text>
<text x="20.00" y="48.00" font-size="12" text-anchor="start" fill="#6b7280">The ITC502 modulation input is 20 mA per volt (about 28 GHz per volt of laser tuning) into 10 kΩ: without a divider one DAC step is 6.8 MHz.</text>
<text x="60.00" y="100.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Schematic</text>
<circle cx="100.00" cy="170.00" r="13.00" fill="#fff" stroke="#1b1f24" stroke-width="1.8"/>
<circle cx="100.00" cy="170.00" r="4.00" fill="#1b1f24" stroke="#1b1f24" stroke-width="1"/>
<text x="100.00" y="150.00" font-size="11.5" text-anchor="middle" fill="#1b1f24" font-weight="700">IN (Red Pitaya OUT 1)</text>
<line x1="113.00" y1="170.00" x2="230.00" y2="170.00" stroke="#1b1f24" stroke-width="2.0" stroke-linecap="round"/>
<line x1="230.00" y1="170.00" x2="298.00" y2="170.00" stroke="#1b1f24" stroke-width="1.8" stroke-linecap="round"/>
<line x1="332.00" y1="170.00" x2="400.00" y2="170.00" stroke="#1b1f24" stroke-width="1.8" stroke-linecap="round"/>
<rect x="298.00" y="163.00" width="34.00" height="14.00" rx="0" fill="#fff" stroke="#1b1f24" stroke-width="1.8"/>
<text x="315.00" y="157.00" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="700">R1</text>
<text x="315.00" y="194.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">91 kΩ, 1 %</text>
<line x1="400.00" y1="170.00" x2="560.00" y2="170.00" stroke="#1b1f24" stroke-width="2.0" stroke-linecap="round"/>
<circle cx="470.00" cy="170.00" r="3.2" fill="#1b1f24"/>
<line x1="470.00" y1="170.00" x2="470.00" y2="215.00" stroke="#1b1f24" stroke-width="2.0" stroke-linecap="round"/>
<rect x="463.00" y="215.00" width="14.00" height="50.00" rx="0" fill="#fff" stroke="#1b1f24" stroke-width="1.8"/>
<line x1="470.00" y1="265.00" x2="470.00" y2="300.00" stroke="#1b1f24" stroke-width="1.8" stroke-linecap="round"/>
<text x="486.00" y="236.00" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="700">R2</text>
<text x="486.00" y="251.00" font-size="11.5" text-anchor="start" fill="#1b1f24">1 kΩ, 1 %</text>
<line x1="470.00" y1="300.00" x2="470.00" y2="307.00" stroke="#1b1f24" stroke-width="1.8" stroke-linecap="round"/>
<line x1="460.00" y1="307.00" x2="480.00" y2="307.00" stroke="#1b1f24" stroke-width="1.8" stroke-linecap="round"/>
<line x1="464.00" y1="311.00" x2="476.00" y2="311.00" stroke="#1b1f24" stroke-width="1.8" stroke-linecap="round"/>
<line x1="467.50" y1="315.00" x2="472.50" y2="315.00" stroke="#1b1f24" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="640.00" cy="170.00" r="13.00" fill="#fff" stroke="#1b1f24" stroke-width="1.8"/>
<circle cx="640.00" cy="170.00" r="4.00" fill="#1b1f24" stroke="#1b1f24" stroke-width="1"/>
<text x="640.00" y="150.00" font-size="11.5" text-anchor="middle" fill="#1b1f24" font-weight="700">OUT (ITC502 MOD IN)</text>
<line x1="560.00" y1="170.00" x2="627.00" y2="170.00" stroke="#1b1f24" stroke-width="2.0" stroke-linecap="round"/>
<line x1="100.00" y1="183.00" x2="100.00" y2="300.00" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
<line x1="100.00" y1="300.00" x2="640.00" y2="300.00" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
<line x1="640.00" y1="183.00" x2="640.00" y2="300.00" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
<circle cx="470.00" cy="300.00" r="3.2" fill="#1b1f24"/>
<text x="250.00" y="322.00" font-size="11.5" text-anchor="start" fill="#6b7280">both BNC shells joined: one ground</text>
<text x="640.00" y="214.00" font-size="11.5" text-anchor="middle" fill="#6b7280">ITC502 input: 10 kΩ to ground</text>
<text x="640.00" y="230.00" font-size="11.5" text-anchor="middle" fill="#6b7280">(in parallel with R2)</text>
<text x="60.00" y="366.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Box: small die-cast aluminium, about 50 × 50 × 27, two BNC jacks (9.5 mm holes)</text>
<rect x="60.00" y="380.00" width="300.00" height="150.00" rx="4" fill="#e4e8ee" stroke="#1b1f24" stroke-width="1.8"/>
<circle cx="100.00" cy="455.00" r="20.00" fill="#fff" stroke="#1b1f24" stroke-width="1.6"/>
<circle cx="100.00" cy="455.00" r="6.00" fill="#1b1f24" stroke="#1b1f24" stroke-width="1"/>
<circle cx="320.00" cy="455.00" r="20.00" fill="#fff" stroke="#1b1f24" stroke-width="1.6"/>
<circle cx="320.00" cy="455.00" r="6.00" fill="#1b1f24" stroke="#1b1f24" stroke-width="1"/>
<text x="100.00" y="498.00" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="700">IN</text>
<text x="320.00" y="498.00" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="700">OUT</text>
<text x="210.00" y="416.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">inside: R1, R2 soldered on</text>
<text x="210.00" y="432.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">the BNC centre pins</text>
<line x1="60.00" y1="530.00" x2="60.00" y2="558.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="360.00" y1="530.00" x2="360.00" y2="558.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="60.00" y1="552.00" x2="360.00" y2="552.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="210.00" y="548.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">about 50 (jack spacing 38)</text>
<line x1="60.00" y1="380.00" x2="14.00" y2="380.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="60.00" y1="530.00" x2="14.00" y2="530.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="20.00" y1="380.00" x2="20.00" y2="530.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="15.00" y="459.00" font-size="11.5" text-anchor="end" fill="#1b1f24">50</text>
<rect x="420.00" y="380.00" width="560.00" height="410.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="434.00" y="404.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Numbers</text>
<text x="434.00" y="428.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Ratio = (R2 ‖ 10 kΩ) / (R1 + R2 ‖ 10 kΩ) = 1 / 101.1.   If the ITC502 input is 9 kΩ:</text>
<text x="434.00" y="445.00" font-size="11.5" text-anchor="start" fill="#1b1f24">1/102.1; 11 kΩ: 1/100.3.</text>
<text x="434.00" y="468.00" font-size="11.5" text-anchor="start" fill="#1b1f24">(R2 sets the ratio, the unknown input impedance of the ITC502 changes it by 1 % only.)</text>
<text x="434.00" y="491.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Laser tuning at the box input: 277 MHz per volt (ITC502: 20 mA/V, laser 1.4 GHz/mA, ÷</text>
<text x="434.00" y="508.00" font-size="11.5" text-anchor="start" fill="#1b1f24">101).</text>
<text x="434.00" y="531.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Red Pitaya output ±2 V into this high impedance → ±0.40 mA → ±0.55 GHz of laser tuning:</text>
<text x="434.00" y="548.00" font-size="11.5" text-anchor="start" fill="#1b1f24">enough for the Doppler-broadened lines.</text>
<text x="434.00" y="571.00" font-size="11.5" text-anchor="start" fill="#1b1f24">One DAC step (14 bit, 4 V span): 0.24 mV → 6.8 MHz without the divider, 0.068 MHz with</text>
<text x="434.00" y="588.00" font-size="11.5" text-anchor="start" fill="#1b1f24">it.</text>
<text x="434.00" y="611.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Bandwidth: source impedance 909 Ω with about 150 pF of cable → corner 1.2 MHz: no effect</text>
<text x="434.00" y="628.00" font-size="11.5" text-anchor="start" fill="#1b1f24">on the 500 kHz of the ITC502.</text>
<text x="434.00" y="651.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Dither for the lock-in: a 5 MHz deviation needs 18 mV at the box input (about 74 DAC</text>
<text x="434.00" y="668.00" font-size="11.5" text-anchor="start" fill="#1b1f24">steps). Without the divider it would need 0.18 mV: less than one DAC step.</text>
<text x="434.00" y="691.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Keep the box away from the fibre, the heater and the solenoid wires.</text>
<rect x="20.00" y="834.00" width="960.00" height="34.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="30.00" y="849.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">D6  Divider</text>
<text x="30.00" y="863.00" font-size="11" text-anchor="start" fill="#6b7280">Two resistors and two BNC jacks: 91 kΩ in series, 1 kΩ to ground. A 1:100 divider turns the 14-bit DAC steps into 0.07 MHz steps.</text>
</svg>
