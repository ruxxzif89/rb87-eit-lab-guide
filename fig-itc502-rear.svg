<text x="128.3" y="422.1" font-size="15" text-anchor="middle" fill="#fff" font-weight="bold">B</text>
<circle cx="364.3" cy="464.3" r="13" fill="#d9770a" stroke="#d9770a" stroke-width="1"/>
<text x="364.3" y="469.3" font-size="15" text-anchor="middle" fill="#fff" font-weight="bold">C</text>
<rect x="30" y="600" width="300" height="176" rx="6" fill="#f1f8f1" stroke="#2e7d32" stroke-width="2"/>
<text x="44" y="624" font-size="14" text-anchor="start" fill="#2e7d32" font-weight="bold">A  TEC OUT (15 pin)</text>
<text x="44" y="648" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">Cell heater and thermistor.</text>
<text x="44" y="668" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">pins 5, 6, 7 = heater + (through a diode)</text>
<text x="44" y="688" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">pins 13, 14, 15 = heater − (ground)</text>
<text x="44" y="708" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">pin 4 = thermistor +, pin 3 = thermistor −</text>
<text x="44" y="728" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">All three pins of each group must be used.</text>
<text x="44" y="748" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">Drawing: next figure (cell heater).</text>
<rect x="350" y="600" width="300" height="176" rx="6" fill="#fdf2f1" stroke="#c0392b" stroke-width="2"/>
<text x="364" y="624" font-size="14" text-anchor="start" fill="#c0392b" font-weight="bold">B  LD OUT (9 pin)</text>
<text x="364" y="648" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">Solenoid current.</text>
<text x="364" y="668" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">pin 8 = coil +, pin 3 = coil −</text>
<text x="364" y="688" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">pins 9 and 6 = optional voltage sense</text>
<text x="364" y="708" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">pins 1 and 5 linked = interlock (required)</text>
<text x="364" y="728" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">pins 2 and 4 (monitor diode): unused.</text>
<text x="364" y="748" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">Drawing: the solenoid figure.</text>
<rect x="670" y="600" width="300" height="176" rx="6" fill="#fff6e8" stroke="#d9770a" stroke-width="2"/>
<text x="684" y="624" font-size="14" text-anchor="start" fill="#d9770a" font-weight="bold">C  DIP switch bank (set once)</text>
<text x="684" y="648" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">1 MODE up = constant current</text>
<text x="684" y="668" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">2 LD POL up = CG (cathode grounded)</text>
<text x="684" y="688" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">4 PD BIAS up = bias off</text>
<text x="684" y="708" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">5 WIN down = window protection on</text>
<text x="684" y="728" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">6 Fix/Var up (adjustable limit pot)</text>
<text x="684" y="748" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">7 down, 8 up = thermistor &lt; 20 kΩ</text>
</svg>
