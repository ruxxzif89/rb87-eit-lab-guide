<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">ITC502 rear panel: where to plug</title><desc id="d">The rear panel of the ITC502 after Figure 2 of the ITC500 manual, with the three places used for the cell heater and the solenoid.</desc>
<rect width="1000" height="800" fill="#ffffff"/>
<text x="30" y="34" font-size="20" text-anchor="start" fill="#1b1f24" font-weight="bold">ITC502 rear panel, as you see it from behind (after Figure 2 of the ITC500 manual)</text>
<text x="30" y="56" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="normal">A = TEC OUT (cell heater and thermistor).   B = LD OUT (solenoid).   C = DIP switch bank (set once).   Gray parts are not used here.</text>
