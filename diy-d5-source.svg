<text x="20.00" y="48.00" font-size="12" text-anchor="start" fill="#6b7280">Used only if the ITC502 laser output is not available or not quiet enough. 0–25 mA, noise about 0.2 µA, drift about 2 µA per kelvin (against the 30 µA allowed).</text>
