<text x="580.00" y="770.00" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="700">solenoid</text>
<text x="640.00" y="680.00" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="700">I = (9 V − 0.01 V) / (560 Ω + RV) = 15 mA</text>
<text x="640.00" y="700.00" font-size="11.5" text-anchor="start" fill="#1b1f24">with RV ≈ 40 Ω. A 9 V battery loses 1–3 % of its voltage</text>
<text x="640.00" y="716.00" font-size="11.5" text-anchor="start" fill="#1b1f24">in the first hours: the current follows. Check with a meter.</text>
<text x="640.00" y="744.00" font-size="11.5" text-anchor="start" fill="#c0392b" font-weight="700">Use the op-amp source above for any real scan.</text>
<text x="34.00" y="882.00" font-size="11.5" text-anchor="start" fill="#1b1f24" font-weight="700">Calibrate either source against the fluxgate: B (mG) = k × I (mA), with k measured, not calculated (free space: 3.39 mG per mA).</text>
