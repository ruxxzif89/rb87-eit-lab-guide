<line x1="95.00" y1="386.70" x2="95.00" y2="421.30" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="500.00" y1="386.70" x2="500.00" y2="421.30" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="95.00" y1="415.30" x2="500.00" y2="415.30" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="297.50" y="411.30" font-size="11.5" text-anchor="middle" fill="#1b1f24">75 (between the windows)</text>
<line x1="500.00" y1="278.70" x2="593.00" y2="278.70" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="500.00" y1="381.30" x2="593.00" y2="381.30" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="587.00" y1="278.70" x2="587.00" y2="381.30" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="592.00" y="334.00" font-size="11.5" text-anchor="start" fill="#1b1f24">tube Ø19</text>
<line x1="297.50" y1="224.70" x2="375.80" y2="168.00" stroke="#6b7280" stroke-width="1.0" stroke-linecap="round"/>
<circle cx="297.50" cy="224.70" r="2.2" fill="#6b7280"/>
<text x="379.80" y="172.00" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="700">stem Ø6, at most 10 high (tip-off)</text>
<line x1="84.20" y1="286.80" x2="73.40" y2="200.40" stroke="#6b7280" stroke-width="1.0" stroke-linecap="round"/>
<circle cx="84.20" cy="286.80" r="2.2" fill="#6b7280"/>
<text x="77.40" y="204.40" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="700">window Ø21 × 3, tilted 11°</text>
<text x="34.00" y="470.00" font-size="12" text-anchor="start" fill="#1b1f24">The windows stand 1 mm proud of the tube and the stem sits on the side at mid-length:</text>
<text x="34.00" y="488.00" font-size="12" text-anchor="start" fill="#1b1f24">a holder must leave room for both (our SAS holder D11: stem ≤ 13 mm, windows ≤ Ø23).</text>
<rect x="600.00" y="80.00" width="420.00" height="720.00" rx="6" fill="none" stroke="#e4e8ee" stroke-width="1.2"/>
<text x="614.00" y="104.00" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">B. Our EIT cell in the solenoid (end view)</text>
