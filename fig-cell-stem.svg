<polygon points="790.20,299.50 802.08,237.50 810.00,231.50 817.92,237.50 829.80,299.50" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="790.20,299.50 802.08,263.90 810.00,257.90 817.92,263.90 829.80,299.50" fill="none" stroke="#d9770a" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="783.60,299.50 802.08,277.10 810.00,271.10 817.92,277.10 836.40,299.50" fill="#d6ebf7" stroke="#2e7d32" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="814.00" y1="231.50" x2="830.00" y2="136.00" stroke="#6b7280" stroke-width="1.0" stroke-linecap="round"/>
<circle cx="814.00" cy="231.50" r="2.2" fill="#6b7280"/>
<text x="834.00" y="140.00" font-size="12" text-anchor="start" fill="#c0392b" font-weight="700">10 mm stem: through the winding</text>
<line x1="804.00" y1="261.90" x2="730.00" y2="160.00" stroke="#6b7280" stroke-width="1.0" stroke-linecap="round"/>
<circle cx="804.00" cy="261.90" r="2.2" fill="#6b7280"/>
<text x="726.00" y="164.00" font-size="12" text-anchor="end" fill="#d9770a" font-weight="700">6 mm: hits the former</text>
<line x1="818.00" y1="274.40" x2="920.00" y2="250.00" stroke="#6b7280" stroke-width="1.0" stroke-linecap="round"/>
<circle cx="818.00" cy="274.40" r="2.2" fill="#6b7280"/>
<text x="924.00" y="254.00" font-size="12" text-anchor="start" fill="#2e7d32" font-weight="700">4 mm: fits</text>
<text x="810.00" y="610.00" font-size="12" text-anchor="middle" fill="#1b1f24">shield bore Ø46 · winding Ø37.8 · former Ø34 / Ø38</text>
<text x="810.00" y="628.00" font-size="12" text-anchor="middle" fill="#1b1f24">foam Ø31.6 · cell Ø25 · beam on the axis</text>
<text x="614.00" y="672.00" font-size="12" text-anchor="start" fill="#2e7d32" font-weight="700">A 4 mm stem leaves 1.1 mm in the printed stem channel.</text>
<text x="614.00" y="690.00" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="700">The wrapped cell slides into the former after the winding,</text>
<text x="614.00" y="708.00" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="700">so everything, stem included, must pass the Ø34 bore.</text>
<text x="614.00" y="730.00" font-size="12" text-anchor="start" fill="#1b1f24">Heater film 68 mm on a 78.5 mm circumference: a 10.5 mm</text>
<text x="614.00" y="748.00" font-size="12" text-anchor="start" fill="#1b1f24">strip stays free under the stem, the cold spot where the</text>
<text x="614.00" y="766.00" font-size="12" text-anchor="start" fill="#1b1f24">Rb collects. A second NTC on the stem base reads it.</text>
<rect x="1040.00" y="80.00" width="400.00" height="720.00" rx="6" fill="none" stroke="#e4e8ee" stroke-width="1.2"/>
<text x="1054.00" y="104.00" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">C. If the vendor’s stem is taller</text>
<rect x="1054.00" y="122.00" width="372.00" height="112.00" rx="5" fill="#f7f8fa" stroke="#2e7d32" stroke-width="1.6"/>
<text x="1066.00" y="142.00" font-size="14" text-anchor="start" fill="#2e7d32" font-weight="700">stem up to 4 mm</text>
<text x="1066.00" y="164.00" font-size="12" text-anchor="start" fill="#1b1f24">former bore Ø34, outside Ø38, winding Ø37.8</text>
<text x="1066.00" y="184.00" font-size="12" text-anchor="start" fill="#1b1f24">field spread 0.20 % (3 end turns) → 0.15 % (4)</text>
<text x="1066.00" y="204.00" font-size="12" text-anchor="start" fill="#1b1f24">innermost shield bore Ø46 (now assumed Ø46)</text>
<text x="1066.00" y="224.00" font-size="12" text-anchor="start" fill="#2e7d32" font-weight="700">our design</text>
<rect x="1054.00" y="254.00" width="372.00" height="112.00" rx="5" fill="#f7f8fa" stroke="#d9770a" stroke-width="1.6"/>
<text x="1066.00" y="274.00" font-size="14" text-anchor="start" fill="#d9770a" font-weight="700">stem up to 6 mm</text>
<text x="1066.00" y="296.00" font-size="12" text-anchor="start" fill="#1b1f24">former bore Ø38, outside Ø42, winding Ø41.8</text>
<text x="1066.00" y="316.00" font-size="12" text-anchor="start" fill="#1b1f24">field spread 0.24 % (3 end turns) → 0.18 % (4)</text>
<text x="1066.00" y="336.00" font-size="12" text-anchor="start" fill="#1b1f24">innermost shield bore Ø50 (now assumed Ø46)</text>
<text x="1066.00" y="356.00" font-size="12" text-anchor="start" fill="#d9770a" font-weight="700">new former, new shield size</text>
<rect x="1054.00" y="386.00" width="372.00" height="112.00" rx="5" fill="#f7f8fa" stroke="#c0392b" stroke-width="1.6"/>
<text x="1066.00" y="406.00" font-size="14" text-anchor="start" fill="#c0392b" font-weight="700">stem up to 10 mm</text>
<text x="1066.00" y="428.00" font-size="12" text-anchor="start" fill="#1b1f24">former bore Ø46, outside Ø50, winding Ø49.8</text>
<text x="1066.00" y="448.00" font-size="12" text-anchor="start" fill="#1b1f24">field spread 0.33 % (3 end turns) → 0.17 % (5)</text>
<text x="1066.00" y="468.00" font-size="12" text-anchor="start" fill="#1b1f24">innermost shield bore Ø58 (now assumed Ø46)</text>
<text x="1066.00" y="488.00" font-size="12" text-anchor="start" fill="#c0392b" font-weight="700">new former, new shield size</text>
<text x="1054.00" y="548.00" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="700">Passing the stem through the winding instead:</text>
<text x="1054.00" y="570.00" font-size="12" text-anchor="start" fill="#1b1f24">· field in the beam stays at about 0.2 %</text>
<text x="1054.00" y="589.00" font-size="12" text-anchor="start" fill="#1b1f24">   (Biot–Savart on the true helix, wire bent</text>
<text x="1054.00" y="608.00" font-size="12" text-anchor="start" fill="#1b1f24">   round a hole of radius 3.5 to 5.5 mm)</text>
<text x="1054.00" y="627.00" font-size="12" text-anchor="start" fill="#1b1f24">· but the cell can no longer slide in after</text>
<text x="1054.00" y="646.00" font-size="12" text-anchor="start" fill="#1b1f24">   the winding, and the stem tip leaves the</text>
<text x="1054.00" y="665.00" font-size="12" text-anchor="start" fill="#1b1f24">   heater: the coldest point sets a lower</text>
<text x="1054.00" y="684.00" font-size="12" text-anchor="start" fill="#1b1f24">   Rb density. Not used.</text>
<text x="1054.00" y="720.00" font-size="12.5" text-anchor="start" fill="#2e7d32" font-weight="700">So: order a short stem (≤ 4 mm at mid-length)</text>
<text x="1054.00" y="740.00" font-size="12" text-anchor="start" fill="#1b1f24">and test-fit the wrapped cell in the 50 mm</text>
<text x="1054.00" y="758.00" font-size="12" text-anchor="start" fill="#1b1f24">test coupon of the former before installing.</text>
</svg>
