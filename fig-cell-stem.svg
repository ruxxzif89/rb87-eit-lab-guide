<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 820" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">The stem of a real vapour cell and where it has to go</title><desc id="d">Three panels. A: a real reference cell from the Thorlabs drawing: a 19 mm tube, 21 mm windows tilted 11 degrees, and a 6 mm torch-sealed stem up to 10 mm high at mid-length. B: end view of our EIT cell stack inside the solenoid former and the shield: a 4 mm stem fits inside the 34 mm bore; 6 and 10 mm stems would hit the former and the winding. C: what a taller stem would cost: former bore, shield bore and end turns.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1"/></pattern><pattern id="hatchf" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#888" stroke-width="0.8"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#999"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b1f24"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1460" height="820" fill="#ffffff"/>
<text x="24.00" y="36.00" font-size="19" text-anchor="start" fill="#1b1f24" font-weight="700">Real cells have a torch-sealed stem (tip-off): where it goes in our holders and in the solenoid</text>
<text x="24.00" y="60.00" font-size="12.5" text-anchor="start" fill="#6b7280">Dimensions in mm. Panel A is redrawn from Thorlabs’ drawing of its Ø19 × 75 mm rubidium cell (GC19075-RB); the Precision Glassblowing stock cell photo shows the same kind of nub at mid-length.</text>
<rect x="20.00" y="80.00" width="560.00" height="420.00" rx="6" fill="none" stroke="#e4e8ee" stroke-width="1.2"/>
<text x="34.00" y="104.00" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="700">A. A real reference cell, side view</text>
<polygon points="95.00,278.70 500.00,278.70 500.00,381.30 95.00,381.30" fill="#d6ebf7" stroke="#1b1f24" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="95.00,386.70 78.80,386.70 56.76,273.30 72.96,273.30" fill="#b9d9ee" stroke="#1b1f24" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="500.00,386.70 516.20,386.70 538.24,273.30 522.04,273.30" fill="#b9d9ee" stroke="#1b1f24" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="281.30,278.70 281.30,240.90 297.50,224.70 313.70,240.90 313.70,278.70" fill="#d6ebf7" stroke="#1b1f24" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
