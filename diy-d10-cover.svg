<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">D10 light-tight cover drawing</title><desc id="d">Cut list, hole positions and assembled view of the hardboard cover that goes over one AOM double-pass arm.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1"/></pattern><pattern id="hatchf" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#888" stroke-width="0.8"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#999"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b1f24"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="840" fill="#ffffff"/>
<text x="20.00" y="28.00" font-size="17" text-anchor="start" fill="#1b1f24" font-weight="700">D10  Light-tight cover for one AOM double-pass arm (black hardboard, 3 mm)</text>
<text x="20.00" y="48.00" font-size="12" text-anchor="start" fill="#6b7280">Cut list at 1.15 px per mm. Arm layout, measured from the PBS end: PBS 25, AOM 75, lens 175 (f = 100), mirror 275 mm; beam height 100 mm.</text>
<text x="50.00" y="98.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Cut list (mm)</text>
<rect x="50.00" y="120.00" width="345.00" height="126.50" rx="0" fill="#f2efe6" stroke="#1b1f24" stroke-width="1.4"/>
<text x="222.50" y="187.25" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="700">top 300 × 110</text>
<line x1="50.00" y1="246.50" x2="50.00" y2="278.50" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="395.00" y1="246.50" x2="395.00" y2="278.50" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
