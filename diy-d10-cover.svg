<text x="162.50" y="408.50" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="700">side 300 × 160 (2×)</text>
<circle cx="366.25" cy="381.50" r="8.05" fill="#fff" stroke="#1b1f24" stroke-width="1.4"/>
<text x="350.20" y="379.50" font-size="11.5" text-anchor="end" fill="#1b1f24">Ø14 out-beam hole</text>
<text x="350.20" y="395.50" font-size="11.5" text-anchor="end" fill="#1b1f24">25 from the end, 100 high</text>
<text x="350.20" y="411.50" font-size="11.5" text-anchor="end" fill="#6b7280">(in one side panel only)</text>
<text x="391.00" y="304.50" font-size="11" text-anchor="end" fill="#6b7280">PBS end</text>
<line x1="50.00" y1="496.50" x2="50.00" y2="528.50" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
