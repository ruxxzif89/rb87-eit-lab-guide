<line x1="50.00" y1="312.50" x2="28.00" y2="312.50" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="50.00" y1="496.50" x2="28.00" y2="496.50" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="34.00" y1="312.50" x2="34.00" y2="496.50" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="29.00" y="408.50" font-size="11.5" text-anchor="end" fill="#1b1f24">160</text>
<rect x="50.00" y="562.50" width="126.50" height="184.00" rx="0" fill="#f2efe6" stroke="#1b1f24" stroke-width="1.4"/>
<text x="113.25" y="584.50" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="700">end 110 × 160 (2×)</text>
<circle cx="113.25" cy="631.50" r="8.05" fill="#fff" stroke="#1b1f24" stroke-width="1.4"/>
<line x1="121.30" y1="631.50" x2="192.50" y2="631.50" stroke="#6b7280" stroke-width="1.0" stroke-linecap="round"/>
<circle cx="121.30" cy="631.50" r="2.2" fill="#6b7280"/>
<text x="196.50" y="635.50" font-size="11.5" text-anchor="start" fill="#1b1f24">Ø14 in-beam hole (one end only), 100 high</text>
<circle cx="153.50" cy="732.70" r="5.17" fill="#fff" stroke="#1b1f24" stroke-width="1.4"/>
<line x1="153.50" y1="732.70" x2="192.50" y2="732.70" stroke="#6b7280" stroke-width="1.0" stroke-linecap="round"/>
<circle cx="153.50" cy="732.70" r="2.2" fill="#6b7280"/>
<text x="196.50" y="736.70" font-size="11.5" text-anchor="start" fill="#1b1f24">Ø9 SMA cable hole, 90 from the left, 12 from the bottom</text>
<line x1="50.00" y1="746.50" x2="50.00" y2="778.50" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="176.50" y1="746.50" x2="176.50" y2="778.50" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="50.00" y1="772.50" x2="176.50" y2="772.50" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="113.25" y="768.50" font-size="11.5" text-anchor="middle" fill="#1b1f24">110</text>
<line x1="50.00" y1="562.50" x2="28.00" y2="562.50" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="50.00" y1="746.50" x2="28.00" y2="746.50" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="34.00" y1="562.50" x2="34.00" y2="746.50" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="29.00" y="658.50" font-size="11.5" text-anchor="end" fill="#1b1f24">160</text>
<text x="580.00" y="98.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Assembled cover (PBS end at the right)</text>
<polygon points="580.00,340.00 865.00,340.00 865.00,188.00 580.00,188.00" fill="#f2efe6" stroke="#1b1f24" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="580.00,188.00 865.00,188.00 901.95,151.05 616.95,151.05" fill="#e6e1d2" stroke="#1b1f24" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="865.00,340.00 901.95,303.05 901.95,151.05 865.00,188.00" fill="#d9d4c3" stroke="#1b1f24" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="847.90,245.00 847.67,243.28 847.01,241.68 845.95,240.30 844.58,239.24 842.97,238.58 841.25,238.35 839.53,238.58 837.92,239.24 836.55,240.30 835.49,241.68 834.83,243.28 834.60,245.00 834.83,246.72 835.49,248.32 836.55,249.70 837.92,250.76 839.53,251.42 841.25,251.65 842.97,251.42 844.58,250.76 845.95,249.70 847.01,248.32 847.67,246.72" fill="#222" stroke="#1b1f24" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="883.47,219.88 884.08,219.50 884.65,219.59 885.14,220.16 885.51,221.17 885.74,222.53 885.82,224.18 885.74,225.98 885.51,227.82 885.14,229.57 884.65,231.11 884.08,232.34 883.47,233.18 882.86,233.56 882.30,233.46 881.81,232.89 881.44,231.89 881.20,230.52 881.12,228.88 881.20,227.08 881.44,225.24 881.81,223.49 882.30,221.94 882.86,220.71" fill="#222" stroke="#1b1f24" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="871.72,317.61 872.11,317.36 872.47,317.42 872.79,317.79 873.03,318.44 873.18,319.32 873.23,320.37 873.18,321.53 873.03,322.71 872.79,323.84 872.47,324.83 872.11,325.62 871.72,326.16 871.33,326.40 870.96,326.34 870.65,325.97 870.41,325.33 870.26,324.45 870.21,323.39 870.26,322.24 870.41,321.05 870.65,319.93 870.96,318.94 871.33,318.14" fill="#222" stroke="#1b1f24" stroke-width="1.0" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="943.47" y1="226.53" x2="883.47" y2="226.53" stroke="#c0392b" stroke-width="2.0" stroke-linecap="round"/>
<line x1="883.47" y1="226.53" x2="622.22" y2="226.53" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round"/>
<line x1="859.72" y1="226.53" x2="841.25" y2="245.00" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round"/>
<line x1="841.25" y1="245.00" x2="826.14" y2="260.11" stroke="#c0392b" stroke-width="2.0" stroke-linecap="round"/>
<circle cx="859.72" cy="226.53" r="3.2" fill="#c0392b"/>
<circle cx="622.22" cy="226.53" r="3.2" fill="#c0392b"/>
<text x="944.00" y="218.53" font-size="11" text-anchor="start" fill="#c0392b" font-weight="700">beam in</text>
<text x="822.14" y="278.11" font-size="11.5" text-anchor="end" fill="#c0392b" font-weight="700">beam out</text>
<text x="883.72" y="343.88" font-size="11" text-anchor="start" fill="#6b7280">SMA</text>
<text x="580.00" y="376.00" font-size="11.5" text-anchor="start" fill="#6b7280">Dashed red = the beam inside the cover: in through the end</text>
<text x="580.00" y="392.00" font-size="11.5" text-anchor="start" fill="#6b7280">panel, through the PBS, AOM, QWP and lens to the mirror, and</text>
<text x="580.00" y="408.00" font-size="11.5" text-anchor="start" fill="#6b7280">back; it leaves through the side hole.</text>
<rect x="580.00" y="438.00" width="400.00" height="364.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="592.00" y="462.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Build rules</text>
<text x="592.00" y="486.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Material: 3 mm black hardboard (Thorlabs TB4 type) or black</text>
<text x="592.00" y="502.00" font-size="11.5" text-anchor="start" fill="#1b1f24">foam-core, matte black inside.</text>
<text x="592.00" y="524.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Joints: black tape or small plastic or aluminium angle</text>
<text x="592.00" y="540.00" font-size="11.5" text-anchor="start" fill="#1b1f24">brackets; no steel screws near the cell shield.</text>
<text x="592.00" y="562.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Holes: Ø14 in-beam hole in one end panel and Ø14 out-beam hole</text>
<text x="592.00" y="578.00" font-size="11.5" text-anchor="start" fill="#1b1f24">in one side panel (both 100 mm above the breadboard, the beam</text>
<text x="592.00" y="594.00" font-size="11.5" text-anchor="start" fill="#1b1f24">height), Ø9 hole for the SMA cable.</text>
<text x="592.00" y="616.00" font-size="11.5" text-anchor="start" fill="#1b1f24">The cover rests on the breadboard around the arm; a strip of</text>
<text x="592.00" y="632.00" font-size="11.5" text-anchor="start" fill="#1b1f24">foam on the table side closes the gap. The razor blade that</text>
<text x="592.00" y="648.00" font-size="11.5" text-anchor="start" fill="#1b1f24">stops the 0th order stays inside.</text>
<text x="592.00" y="670.00" font-size="11.5" text-anchor="start" fill="#1b1f24">A beam never leaves the cover except through a hole closed by</text>
<text x="592.00" y="686.00" font-size="11.5" text-anchor="start" fill="#1b1f24">an SM1 tube or a black card with a hole.</text>
<text x="592.00" y="708.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Label every cover "795 nm invisible laser".</text>
<text x="592.00" y="730.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Detector: a black SM1 tube (50 mm) in front of the photodiode</text>
<text x="592.00" y="746.00" font-size="11.5" text-anchor="start" fill="#1b1f24">keeps room light off it.</text>
<text x="592.00" y="768.00" font-size="11.5" text-anchor="start" fill="#1b1f24">The cover also stops draughts, which makes the AOM and the</text>
<text x="592.00" y="784.00" font-size="11.5" text-anchor="start" fill="#1b1f24">cell more stable under it.</text>
<rect x="20.00" y="794.00" width="960.00" height="34.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="30.00" y="809.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">D10  Cover</text>
<text x="30.00" y="823.00" font-size="11" text-anchor="start" fill="#6b7280">Top 300 × 110, two sides 300 × 160, two ends 110 × 160 with the beam and cable holes. Inner height 160 = beam height 100 + 60 mm over the mounts.</text>
</svg>
