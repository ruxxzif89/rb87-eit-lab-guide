<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">ITC502 unit 2: cell heater wiring</title><desc id="d">The TEC output of the second ITC502 feeds the foil heater through a series diode; the thermistor on the cell goes to the thermistor input.</desc>
<rect width="1000" height="860" fill="#ffffff"/>
<text x="30" y="34" font-size="20" text-anchor="start" fill="#1b1f24" font-weight="bold">ITC502 unit 2 as the cell-heater controller (TEC output, rear panel)</text>
<text x="30" y="56" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="normal">From the ITC500 operation manual, chapter 1.9. Red = TEC +, blue = TEC − (ground), green = thermistor, purple = shield.</text>
<rect x="30" y="80" width="300" height="440" rx="8" fill="#f3f5f8" stroke="#1b1f24" stroke-width="2.5"/>
<text x="180" y="106" font-size="15" text-anchor="middle" fill="#1b1f24" font-weight="bold">ITC502 rear panel</text>
<rect x="48" y="120" width="264" height="380" rx="6" fill="#fff" stroke="#1b1f24" stroke-width="1.8"/>
<text x="180" y="144" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="bold">TEC output (15-pin D-sub)</text>
<text x="60" y="168" font-size="12.5" text-anchor="start" fill="#c0392b" font-weight="bold">TEC +  (pins 5, 6, 7 tied together)</text>
<circle cx="86" cy="192" r="11" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="86" y="196.5" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">5</text>
<circle cx="126" cy="192" r="11" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="126" y="196.5" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">6</text>
<circle cx="166" cy="192" r="11" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="166" y="196.5" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">7</text>
<polyline points="86,203 86,214 166,214 166,203" fill="none" stroke="#c0392b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="126" y1="203" x2="126" y2="214" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="250" font-size="12.5" text-anchor="start" fill="#1f5fa8" font-weight="bold">TEC −, ground  (pins 13, 14, 15 tied)</text>
<circle cx="86" cy="274" r="11" fill="#fff" stroke="#1f5fa8" stroke-width="2"/>
<text x="86" y="278.5" font-size="12" text-anchor="middle" fill="#1f5fa8" font-weight="bold">13</text>
<circle cx="126" cy="274" r="11" fill="#fff" stroke="#1f5fa8" stroke-width="2"/>
<text x="126" y="278.5" font-size="12" text-anchor="middle" fill="#1f5fa8" font-weight="bold">14</text>
<circle cx="166" cy="274" r="11" fill="#fff" stroke="#1f5fa8" stroke-width="2"/>
<text x="166" y="278.5" font-size="12" text-anchor="middle" fill="#1f5fa8" font-weight="bold">15</text>
<polyline points="86,285 86,296 166,296 166,285" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="126" y1="285" x2="126" y2="296" stroke="#1f5fa8" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="340" font-size="12.5" text-anchor="start" fill="#2e7d32" font-weight="bold">Thermistor input</text>
<circle cx="116" cy="366" r="11" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
<text x="116" y="370.5" font-size="12" text-anchor="middle" fill="#2e7d32" font-weight="bold">4</text>
<text x="142" y="358" font-size="12" text-anchor="start" fill="#2e7d32" font-weight="bold">+ thermistor</text>
<circle cx="116" cy="404" r="11" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
<text x="116" y="408.5" font-size="12" text-anchor="middle" fill="#2e7d32" font-weight="bold">3</text>
<text x="142" y="396" font-size="12" text-anchor="start" fill="#2e7d32" font-weight="bold">− (ground side)</text>
<text x="60" y="452" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="normal">Pins 2, 9: heater V sense (leave open).</text>
<text x="60" y="470" font-size="11.5" text-anchor="start" fill="#6b7280" font-weight="normal">Pins 12, 1, 8: leave open.</text>
<polyline points="126,214 126,232 380,232" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="380,232 394,232" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="394,218 394,246 422,232" fill="#fff" stroke="#c0392b" stroke-width="2.5"/>
<line x1="422" y1="217" x2="422" y2="247" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
<polyline points="422,232 436,232" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="436,232 580,232" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="580,232 601.6666666666666,222 625.0,242 648.3333333333334,222 671.6666666666666,242 695.0,222 718.3333333333333,242 740,232" fill="none" stroke="#d9770a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="740,232 790,232 790,314" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="790,314 790,314" fill="none" stroke="#1f5fa8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="790,314 126,314 126,296" fill="none" stroke="#1f5fa8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="408" y="206" font-size="12.5" text-anchor="middle" fill="#c0392b" font-weight="bold">series diode</text>
<text x="408" y="270" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="normal">1N5400, 3 A</text>
<text x="408" y="286" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="normal">stripe (cathode)</text>
<text x="408" y="302" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="normal">towards the heater</text>
<text x="660" y="206" font-size="13" text-anchor="middle" fill="#d9770a" font-weight="bold">foil heater, 10–20 Ω</text>
<text x="660" y="258" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="normal">twist the two leads together</text>
<polyline points="127,366 560,366" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="560,366 583.3333333333334,356 610.0,376 636.6666666666666,356 663.3333333333334,376 690.0,356 716.6666666666667,376 740,366" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="740,366 840,366 840,404 127,404" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="650" y="340" font-size="13" text-anchor="middle" fill="#2e7d32" font-weight="bold">NTC thermistor 10 kΩ</text>
<rect x="350" y="346" width="520" height="76" rx="10" fill="none" stroke="#7b4fa3" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="610" y="442" font-size="12.5" text-anchor="middle" fill="#7b4fa3" font-weight="bold">twisted shielded pair; shield to pins 13–15</text>
<rect x="360" y="470" width="600" height="160" rx="10" fill="none" stroke="#7b4fa3" stroke-width="2" stroke-dasharray="10 6"/>
<text x="660" y="492" font-size="12.5" text-anchor="middle" fill="#7b4fa3" font-weight="bold">inside the µ-metal shield (leads leave through a port)</text>
<rect x="470" y="515" width="380" height="90" rx="30" fill="#e8f1fb" stroke="#1b1f24" stroke-width="2.5"/>
<text x="690" y="592" font-size="13" text-anchor="middle" fill="#1b1f24" font-weight="bold">Rb cell (Ø25 mm) in the solenoid</text>
<rect x="462" y="508" width="396" height="104" rx="34" fill="none" stroke="#d9770a" stroke-width="6" stroke-dasharray="16 6"/>
<text x="660" y="626" font-size="12.5" text-anchor="middle" fill="#d9770a" font-weight="bold">foil heater wrapped round the cell</text>
<circle cx="520" cy="528" r="7" fill="#2e7d32" stroke="#1b1f24" stroke-width="1.5"/>
<text x="530" y="548" font-size="11.5" text-anchor="start" fill="#2e7d32" font-weight="bold">NTC glued to</text>
<text x="530" y="562" font-size="11.5" text-anchor="start" fill="#2e7d32" font-weight="bold">the cell wall</text>
<rect x="30" y="650" width="940" height="210" rx="6" fill="#fffbe8" stroke="#b58900" stroke-width="1.8"/>
<text x="48" y="674" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="bold">Settings and first switch-on</text>
<text x="48" y="696" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">SENSOR = thermistor; DIP SW7 down and SW8 up = "TH &lt; 20 kΩ" (100 µA). T SET = thermistor resistance at the wanted temperature</text>
<text x="48" y="713" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">(10 kΩ NTC, B ≈ 3900 K: about 2.1 kΩ at 65 °C).</text>
<text x="48" y="730" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">I TEC LIM (pot beside its LED) = 0.8 A at first; T WIN about ±200 Ω with SW5 down (window protection on). Heater voltage =</text>
<text x="48" y="747" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">resistance × current: keep under about 7 V.</text>
<text x="48" y="764" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">First switch-on: cell at room temperature, T SET warmer, TEC ON. If I TEC stays near 0 mA and nothing heats, reverse the diode.</text>
<text x="48" y="781" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">Never start with T SET below the cell temperature.</text>
<text x="48" y="798" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">Why the diode: a resistor heats for either current direction, so an overshoot would make the controller heat harder (thermal</text>
<text x="48" y="815" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">runaway). The diode blocks that direction.</text>
<text x="48" y="832" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">Twist the heater leads together all the way so the DC current makes almost no field inside the shield; check with the fluxgate,</text>
<text x="48" y="849" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">heater on and off.</text>
</svg>
