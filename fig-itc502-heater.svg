<text x="500" y="600" font-size="13" text-anchor="middle" fill="#1b1f24" font-weight="bold">Rb cell (Ø25 mm) inside the solenoid</text>
<rect x="292" y="538" width="416" height="114" rx="38" fill="none" stroke="#d9770a" stroke-width="6" stroke-dasharray="16 6"/>
<text x="500" y="668" font-size="12.5" text-anchor="middle" fill="#d9770a" font-weight="bold">foil heater wrapped round the cell (the orange resistor above)</text>
<circle cx="340" cy="566" r="7" fill="#2e7d32" stroke="#1b1f24" stroke-width="1.5"/>
<text x="356" y="563" font-size="11.5" text-anchor="start" fill="#2e7d32" font-weight="bold">NTC glued to the cell wall</text>
<text x="356" y="577" font-size="11.5" text-anchor="start" fill="#2e7d32" font-weight="normal">(the green thermistor above)</text>
<text x="30" y="702" font-size="13.5" text-anchor="start" fill="#d9770a" font-weight="bold">DIP switch bank (rear panel, C): set before use</text>
