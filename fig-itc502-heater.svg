<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 940" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">ITC502 unit 2: cell heater wiring</title><desc id="d">The TEC OUT jack of the second ITC502 drives the foil heater through a diode; the thermistor on the cell goes to pins 4 and 3.</desc>
<rect width="1000" height="940" fill="#ffffff"/>
<text x="30" y="34" font-size="20" text-anchor="start" fill="#1b1f24" font-weight="bold">Cell heater on the TEC OUT jack (the 15-pin D-sub, labelled A on the rear panel)</text>
<text x="30" y="56" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="normal">The connector is drawn as you look into the jack on the rear panel: wide row on top, pin 1 at the top right (ITC500 manual, Figure 4). Check the pin numbers printed next to the jack.</text>
<text x="640" y="96" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="bold">TEC OUT: 15-pin D-sub (the jack on the ITC502 rear panel)</text>
