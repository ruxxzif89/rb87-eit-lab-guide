<text x="319.0" y="250" font-size="13" text-anchor="middle" fill="#d9770a" font-weight="bold">foil heater 10–20 Ω</text>
<text x="299.0" y="332" font-size="12" text-anchor="middle" fill="#1b1f24" font-weight="normal">twist both leads together</text>
<text x="499.0" y="306" font-size="12.5" text-anchor="end" fill="#c0392b" font-weight="bold">diode 1N5400 (3 A)</text>
<text x="499.0" y="322" font-size="11.5" text-anchor="end" fill="#c0392b" font-weight="normal">stripe towards heater</text>
<text x="583.0" y="258" font-size="12.5" text-anchor="middle" fill="#c0392b" font-weight="bold">TEC +  (pins 7, 6, 5)</text>
<text x="564.0" y="448" font-size="12.5" text-anchor="middle" fill="#1f5fa8" font-weight="bold">TEC −, ground  (pins 15, 14, 13)</text>
