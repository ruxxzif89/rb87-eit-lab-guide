<text x="820" y="150" font-size="13" text-anchor="middle" fill="#2e7d32" font-weight="bold">NTC thermistor 10 kΩ</text>
<text x="651.0" y="162" font-size="12" text-anchor="end" fill="#2e7d32" font-weight="bold">pin 4 (+)</text>
<text x="705.0" y="232" font-size="12" text-anchor="start" fill="#2e7d32" font-weight="bold">pin 3 (− , ground side)</text>
<rect x="629.0" y="130" width="296.0" height="114" rx="10" fill="none" stroke="#7b4fa3" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="820" y="122" font-size="12" text-anchor="middle" fill="#7b4fa3" font-weight="bold">shielded twisted pair, shield to pins 13–15</text>
<text x="640" y="478" font-size="12" text-anchor="middle" fill="#6b7280" font-weight="normal">Gray pins unused: 1 and 8 (status LED), 2 and 9 (voltage sense), 10 and 11 (AD590), 12 (supply for Thorlabs mounts: do not connect).</text>
<rect x="120" y="500" width="760" height="170" rx="10" fill="none" stroke="#7b4fa3" stroke-width="2" stroke-dasharray="10 6"/>
<text x="500" y="522" font-size="12.5" text-anchor="middle" fill="#7b4fa3" font-weight="bold">inside the µ-metal shield (leads leave through a port)</text>
