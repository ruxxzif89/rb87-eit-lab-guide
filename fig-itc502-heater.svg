<text x="340" y="740" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="normal">SW5 down: window protection on</text>
<text x="340" y="758" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="normal">SW6 up: adjustable TEC limit</text>
<text x="340" y="776" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="normal">SW7 down + SW8 up: thermistor below 20 kΩ</text>
<text x="340" y="794" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">SW1 to SW4: as for the solenoid figure (same box)</text>
<rect x="30" y="808" width="940" height="108" rx="6" fill="#fffbe8" stroke="#b58900" stroke-width="1.8"/>
<text x="48" y="832" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="bold">First switch-on</text>
<text x="48" y="854" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">SENSOR = thermistor. T SET = thermistor resistance at the wanted temperature (10 kΩ NTC, B ≈ 3900 K: about 2.1 kΩ at 65 °C). I</text>
<text x="48" y="871" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">TEC LIM (pot beside its LED) = 0.8 A at first. T WIN about ±200 Ω.</text>
<text x="48" y="888" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">Cell at room temperature, T SET warmer, TEC ON. If I TEC stays near 0 mA and nothing heats, reverse the diode. Never start with</text>
<text x="48" y="905" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">T SET below the cell temperature.</text>
