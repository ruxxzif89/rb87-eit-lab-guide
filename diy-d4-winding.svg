<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">D4 degaussing winding on the shield</title><desc id="d">End view and side view of the toroidal degaussing winding: the wire passes through the bore of the shield and returns outside in three groups.</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#555" stroke-width="1"/></pattern><pattern id="hatchf" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#888" stroke-width="0.8"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.8" fill="#999"/></pattern><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1b1f24"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs>
<rect width="1000" height="1000" fill="#ffffff"/>
<text x="20.00" y="28.00" font-size="17" text-anchor="start" fill="#1b1f24" font-weight="700">D4  Degaussing winding: through the bore, back outside in three groups</text>
<text x="20.00" y="48.00" font-size="12" text-anchor="start" fill="#6b7280">The winding must pass through the shield so that the AC flux circulates round the shield wall (Twinleaf guidance). Layer radii are illustrative.</text>
<circle cx="270.00" cy="330.00" r="175.72" fill="#9aa5b1" stroke="#1b1f24" stroke-width="1.2"/>
<circle cx="270.00" cy="330.00" r="170.20" fill="#ffffff" stroke="#1b1f24" stroke-width="1.2"/>
<circle cx="270.00" cy="330.00" r="143.52" fill="#9aa5b1" stroke="#1b1f24" stroke-width="1.2"/>
<circle cx="270.00" cy="330.00" r="138.00" fill="#ffffff" stroke="#1b1f24" stroke-width="1.2"/>
<circle cx="270.00" cy="330.00" r="111.32" fill="#9aa5b1" stroke="#1b1f24" stroke-width="1.2"/>
<circle cx="270.00" cy="330.00" r="105.80" fill="#ffffff" stroke="#1b1f24" stroke-width="1.2"/>
<path d="M 212.9 413.5 A 101.2 101.2 0 0 1 327.1 413.5" fill="none" stroke="#c0392b" stroke-width="7.0" stroke-linejoin="round" stroke-linecap="round"/>
<text x="270.00" y="314.00" font-size="11.5" text-anchor="middle" fill="#c0392b" font-weight="700">inner leg: 30 wires,</text>
<text x="270.00" y="330.00" font-size="11.5" text-anchor="middle" fill="#c0392b" font-weight="700">side by side, flat, on the</text>
<text x="270.00" y="346.00" font-size="11.5" text-anchor="middle" fill="#c0392b" font-weight="700">inner wall of layer 1</text>
<text x="270.00" y="364.00" font-size="11.5" text-anchor="middle" fill="#c0392b">(⊙ out of the page)</text>
<circle cx="270.00" cy="151.52" r="10.00" fill="#fff" stroke="#1b1f24" stroke-width="1.6"/>
<line x1="264.00" y1="145.52" x2="276.00" y2="157.52" stroke="#1b1f24" stroke-width="1.6" stroke-linecap="round"/>
<line x1="264.00" y1="157.52" x2="276.00" y2="145.52" stroke="#1b1f24" stroke-width="1.6" stroke-linecap="round"/>
<text x="270.00" y="131.52" font-size="11.5" text-anchor="middle" fill="#1b1f24" font-weight="700">group 1: 10 returns (⊗)</text>
<circle cx="115.43" cy="419.24" r="10.00" fill="#fff" stroke="#1b1f24" stroke-width="1.6"/>
<line x1="109.43" y1="413.24" x2="121.43" y2="425.24" stroke="#1b1f24" stroke-width="1.6" stroke-linecap="round"/>
<line x1="109.43" y1="425.24" x2="121.43" y2="413.24" stroke="#1b1f24" stroke-width="1.6" stroke-linecap="round"/>
<text x="24.00" y="453.24" font-size="11.5" text-anchor="start" fill="#1b1f24" font-weight="700">group 2</text>
<text x="24.00" y="469.24" font-size="11.5" text-anchor="start" fill="#1b1f24" font-weight="700">10 returns (⊗)</text>
<circle cx="424.57" cy="419.24" r="10.00" fill="#fff" stroke="#1b1f24" stroke-width="1.6"/>
<line x1="418.57" y1="413.24" x2="430.57" y2="425.24" stroke="#1b1f24" stroke-width="1.6" stroke-linecap="round"/>
<line x1="418.57" y1="425.24" x2="430.57" y2="413.24" stroke="#1b1f24" stroke-width="1.6" stroke-linecap="round"/>
<text x="432.00" y="453.24" font-size="11.5" text-anchor="start" fill="#1b1f24" font-weight="700">group 3</text>
<text x="432.00" y="469.24" font-size="11.5" text-anchor="start" fill="#1b1f24" font-weight="700">10 returns (⊗)</text>
<path d="M 148.1 320.0 A 121.9 121.9 0 0 1 330.9 224.4" fill="none" stroke="#2e7d32" stroke-width="2.0" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="270.00" y="560.48" font-size="11.5" text-anchor="middle" fill="#2e7d32" font-weight="700">dashed green: the AC flux circulates round the shield wall</text>
<text x="270.00" y="104.00" font-size="13" text-anchor="middle" fill="#1b1f24" font-weight="700">End view (the shield is cut across)</text>
<text x="740.00" y="104.00" font-size="13" text-anchor="middle" fill="#1b1f24" font-weight="700">Side view</text>
<rect x="560.00" y="250.00" width="360.00" height="170.00" rx="0" fill="#dfe4ea" stroke="#1b1f24" stroke-width="1.4"/>
<rect x="570.00" y="258.00" width="340.00" height="154.00" rx="0" fill="#ffffff" stroke="#1b1f24" stroke-width="1.0"/>
<rect x="660.00" y="320.00" width="160.00" height="30.00" rx="0" fill="url(#hatch)" stroke="#1b1f24" stroke-width="1.0"/>
<text x="740.00" y="310.00" font-size="11.5" text-anchor="middle" fill="#1b1f24" font-weight="700">solenoid former (D1) in the bore</text>
<rect x="660.00" y="320.00" width="160.00" height="30.00" rx="0" fill="none" stroke="#1b1f24" stroke-width="1.0"/>
<line x1="530.00" y1="368.00" x2="950.00" y2="368.00" stroke="#c0392b" stroke-width="5.0" stroke-linecap="round"/>
<text x="740.00" y="390.00" font-size="11.5" text-anchor="middle" fill="#c0392b" font-weight="700">inner leg (30 wires) in the bore</text>
<line x1="530.00" y1="228.00" x2="950.00" y2="228.00" stroke="#1b1f24" stroke-width="3.0" stroke-linecap="round"/>
<text x="740.00" y="220.00" font-size="11.5" text-anchor="middle" fill="#1b1f24" font-weight="700">group 1 return (outside, top): 10 wires</text>
<line x1="530.00" y1="442.00" x2="950.00" y2="442.00" stroke="#1b1f24" stroke-width="3.0" stroke-linecap="round"/>
<text x="740.00" y="460.00" font-size="11.5" text-anchor="middle" fill="#1b1f24" font-weight="700">group 2 return (outside, front): 10 wires</text>
<line x1="530.00" y1="472.00" x2="950.00" y2="472.00" stroke="#1b1f24" stroke-width="3.0" stroke-linecap="round"/>
<text x="740.00" y="490.00" font-size="11.5" text-anchor="middle" fill="#1b1f24" font-weight="700">group 3 return (outside, back): 10 wires</text>
<line x1="530.00" y1="228.00" x2="530.00" y2="472.00" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round"/>
<line x1="950.00" y1="228.00" x2="950.00" y2="472.00" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3" stroke-linecap="round"/>
<text x="740.00" y="504.00" font-size="11.5" text-anchor="middle" fill="#6b7280">at both ends the wires turn round the end of the shield (dashed)</text>
<line x1="560.00" y1="228.00" x2="560.00" y2="190.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="920.00" y1="228.00" x2="920.00" y2="190.00" stroke="#6b7280" stroke-width="0.9" stroke-linecap="round"/>
<line x1="560.00" y1="196.00" x2="920.00" y2="196.00" stroke="#1b1f24" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="740.00" y="192.00" font-size="11.5" text-anchor="middle" fill="#1b1f24">shield length 250 (BOM)</text>
<rect x="20.00" y="590.00" width="960.00" height="340.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="34.00" y="614.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">Numbers</text>
<text x="34.00" y="640.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Wire: flexible copper 0.5 mm² (AWG 20) with thin insulation (PTFE or thin silicone, outer Ø ≤ 1.3 mm), 30 turns = 30 wires in the bore, 24 m in all</text>
<text x="34.00" y="657.00" font-size="11.5" text-anchor="start" fill="#1b1f24">(0.8 m per turn), resistance 0.83 Ω.</text>
<text x="34.00" y="683.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Winding: one wire, wound like a toroid: through the bore, back along group 1, through the bore, back along group 2, then group 3, and so on, 10</text>
<text x="34.00" y="700.00" font-size="11.5" text-anchor="start" fill="#1b1f24">times each.</text>
<text x="34.00" y="726.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Field in the wall at I rms = 1 A: H peak = N·√2·I / 2πr = 193 A/m at r = 35 mm (outer layer), 270 A/m at r = 25 mm. Mu-metal saturates at a few tens</text>
<text x="34.00" y="743.00" font-size="11.5" text-anchor="start" fill="#1b1f24">of A/m.</text>
<text x="34.00" y="769.00" font-size="11.5" text-anchor="start" fill="#1b1f24">So 1 A rms is already well above saturation for every layer; the procedure uses up to 2 A rms. Each ramp-down takes 100 to 300 s (Twinleaf: longer</text>
<text x="34.00" y="786.00" font-size="11.5" text-anchor="start" fill="#1b1f24">is better).</text>
<text x="34.00" y="812.00" font-size="11.5" text-anchor="start" fill="#1b1f24">The inner leg lives in the 3.45 mm gap between former and shield: it must lie flat (30 × Ø1.3 mm side by side = 39 mm wide, 1.3 mm thick) and, as a</text>
<text x="34.00" y="829.00" font-size="11.5" text-anchor="start" fill="#1b1f24">round bundle of about Ø8 mm, pass the end-cap feed-through (Ø20 mm).</text>
<text x="34.00" y="855.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Opening the shield magnetises the inner layers again (Twinleaf: 10 to 100 nT remain after reassembly): degauss last, with the shield closed and the</text>
<text x="34.00" y="872.00" font-size="11.5" text-anchor="start" fill="#1b1f24">cell and the fluxgate plate in their final places.</text>
<text x="34.00" y="898.00" font-size="11.5" text-anchor="start" fill="#1b1f24">Return wires: tie them to the outside of the outer layer with Velcro or tape at 120° (never steel clips), cross-wires 10 mm apart.</text>
<rect x="20.00" y="954.00" width="960.00" height="34.00" rx="0" fill="#f7f8fa" stroke="#1b1f24" stroke-width="1.2"/>
<text x="30.00" y="969.00" font-size="13" text-anchor="start" fill="#1b1f24" font-weight="700">D4  Degaussing winding</text>
<text x="30.00" y="983.00" font-size="11" text-anchor="start" fill="#6b7280">30 turns, three outside groups of 10 returns, one flat inner bundle. Drive: 50 Hz from a variac and a 24 V isolating transformer (next figure).</text>
</svg>
