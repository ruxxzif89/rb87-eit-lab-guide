<text x="940" y="700" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal">fluxgate (calibration)</text>
<text x="30" y="470" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">Gray pins unused: 2 and 4 (monitor diode, leave open), 7 (laser cathode).</text>
<rect x="30" y="760" width="330" height="84" rx="6" fill="#f6fbf6" stroke="#2e7d32" stroke-width="2"/>
<text x="195" y="786" font-size="12.5" text-anchor="middle" fill="#2e7d32" font-weight="bold">FLC100: 5 V linear supply, ground, signal</text>
<text x="195" y="806" font-size="12" text-anchor="middle" fill="#2e7d32" font-weight="normal">to a multimeter or scope, outside the shield</text>
<text x="195" y="824" font-size="11.5" text-anchor="middle" fill="#6b7280" font-weight="normal">check the pin order in its datasheet</text>
