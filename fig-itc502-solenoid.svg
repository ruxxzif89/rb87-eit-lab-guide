<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1012" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif">
<title id="t">ITC502 unit 2: solenoid wiring</title><desc id="d">The LD OUT jack of the second ITC502 drives the solenoid; pins 1 and 5 are linked; a fluxgate calibrates the field.</desc>
<rect width="1000" height="1012" fill="#ffffff"/>
<text x="30" y="34" font-size="20" text-anchor="start" fill="#1b1f24" font-weight="bold">Solenoid on the LD OUT jack (the 9-pin D-sub, labelled B on the rear panel)</text>
<text x="30" y="56" font-size="12.5" text-anchor="start" fill="#6b7280" font-weight="normal">The connector is drawn as you look into the jack on the rear panel: wide row on top, pin 1 at the top right (ITC500 manual, Figure 3). Check the pin numbers printed next to the jack.</text>
<text x="300" y="100" font-size="14" text-anchor="middle" fill="#1b1f24" font-weight="bold">LD OUT: 9-pin D-sub (the jack on the ITC502 rear panel)</text>
