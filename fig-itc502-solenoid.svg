<text x="710" y="798" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="normal">SW1 up: constant current</text>
<text x="710" y="816" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="normal">SW2 up: CG (cathode grounded)</text>
<text x="710" y="834" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="normal">SW4 up: monitor-diode bias off</text>
<text x="710" y="852" font-size="12" text-anchor="start" fill="#6b7280" font-weight="normal">SW5 to SW8: as for the heater figure</text>
<rect x="30" y="880" width="940" height="108" rx="6" fill="#fffbe8" stroke="#b58900" stroke-width="1.8"/>
<text x="48" y="904" font-size="14" text-anchor="start" fill="#1b1f24" font-weight="bold">Front panel and first switch-on</text>
<text x="48" y="926" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">LD POL button = CG. Set the current limit ILD LIM with the 25-turn ADJ pot, a little above the working current. Connect the coil</text>
<text x="48" y="943" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">with the output off; raise the current slowly (10 µA steps).</text>
<text x="48" y="960" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">Accuracy is ±100 µA: calibrate the field against the current with the fluxgate. Design the coil for 10–20 mA (200–400 turns per</text>
<text x="48" y="977" font-size="12.5" text-anchor="start" fill="#1b1f24" font-weight="normal">metre).</text>
