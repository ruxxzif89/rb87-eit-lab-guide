<text x="20.00" y="48.00" font-size="12" text-anchor="start" fill="#6b7280">All dimensions in mm, both views at 12 px per mm. The cube is held by four corner pillars that touch only the outer 1.5 mm of each face, and by a clamp plate on top.</text>
