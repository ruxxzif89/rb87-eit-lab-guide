<text x="32.00" y="769.00" font-size="12" text-anchor="start" fill="#1b1f24">Screw variant: Ø4.5 through hole, counterbore Ø8.0 × 4.2 under the cube, M4 × 10 socket screw into the post (5.2 mm of thread in the post).</text>
<text x="32.00" y="788.00" font-size="12" text-anchor="start" fill="#1b1f24">Clamp: two M3 × 12 screws into the Ø2.5 pilot holes of two diagonal pillars; the centre M3 nylon screw presses on the top face (a ground face, not an optical one).</text>
<text x="32.00" y="807.00" font-size="12" text-anchor="start" fill="#1b1f24">Open width of every face between the ribs: 10.1 mm, about twice the widest beam (5.1 mm, the expanded control).</text>
